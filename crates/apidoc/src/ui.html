<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Documentation</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --border:#e3e6ea; --text:#24292f; --muted:#6b7280; --accent:#2563eb; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
header { background:var(--panel); border-bottom:1px solid var(--border); padding:12px 20px; }
header h1 { margin:0; font-size:18px; }
header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
#sel-row { display:none; gap:8px; align-items:center; background:var(--panel); border-bottom:1px solid var(--border); padding:8px 20px; }
#sel-row select { padding:3px 6px; border:1px solid var(--border); border-radius:4px; font-size:13px; }
#app { display:flex; align-items:flex-start; }
#groups { width:280px; flex:none; background:var(--panel); border-right:1px solid var(--border); height:calc(100vh - 61px); overflow:auto; padding:12px 0; }
#groups h2 { font-size:12px; color:var(--muted); margin:14px 16px 6px; text-transform:uppercase; letter-spacing:.05em; }
#groups a { display:flex; gap:8px; align-items:center; padding:7px 16px; color:var(--text); text-decoration:none; border-left:3px solid transparent; }
#groups a:hover { background:#f0f3f8; }
#groups a.active { background:#eaf1fe; border-left-color:var(--accent); }
.badge { flex:none; width:52px; text-align:center; font-size:11px; font-weight:700; color:#fff; border-radius:4px; padding:1px 0; }
#detail { flex:1; padding:24px 32px; max-width:960px; }
#detail h2 { margin:0 0 4px; font-size:20px; }
.endpoint-line { display:flex; gap:10px; align-items:center; margin:8px 0 4px; }
.endpoint-line .badge { width:auto; padding:2px 10px; }
code { background:#eef1f5; border-radius:4px; padding:2px 6px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
#detail .desc { color:var(--muted); margin-bottom:16px; }
section { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px 20px; margin-bottom:16px; }
section h3 { margin:0 0 10px; font-size:15px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
th { color:var(--muted); font-weight:600; white-space:nowrap; }
td.name { font-family:ui-monospace,Menlo,monospace; white-space:nowrap; }
.empty { color:var(--muted); }
/* 在线调试 */
.debug-row { display:flex; gap:8px; align-items:center; margin:4px 0; }
.debug-row label { width:230px; flex:none; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
.debug-row input { flex:1; min-width:0; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:13px; }
.debug-row input:read-only { background:#f3f4f6; }
.debug-title { display:flex; gap:16px; align-items:center; margin-bottom:10px; }
.debug-title h3 { margin:0; }
.debug-actions { display:flex; gap:8px; align-items:center; margin-top:10px; }
.debug-actions input { flex:1; min-width:0; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:13px; }
button { padding:4px 12px; border:1px solid var(--border); border-radius:4px; background:#fff; cursor:pointer; font-size:13px; }
button:hover { background:#f0f3f8; }
#debug-result pre { white-space:pre-wrap; background:#f8f9fb; border:1px solid var(--border); border-radius:6px; padding:10px 12px; font-family:ui-monospace,Menlo,monospace; font-size:13px; margin:8px 0 0; }
/* M6a 密码遮罩：全屏覆盖层，非受控状态 display:none */
#mask { display:none; position:fixed; inset:0; background:var(--bg); z-index:10; align-items:center; justify-content:center; }
#mask-box { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:28px 32px; width:320px; text-align:center; }
#mask-box h2 { margin:0 0 8px; font-size:16px; }
#mask-box input { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:4px; margin:12px 0; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1 id="title">API Documentation</h1>
  <p id="subtitle"></p>
</header>
<div id="sel-row">
  <label>应用</label><select id="apps-sel"></select>
  <label>版本</label><select id="ver-sel"></select>
</div>
<div id="app">
  <nav id="groups"></nav>
  <main id="detail"><p class="empty">加载中…</p></main>
</div>
<div id="mask">
  <div id="mask-box">
    <h2>访问受保护</h2>
    <p id="mask-msg" class="empty"></p>
    <input id="mask-pw" type="password" placeholder="请输入访问密码">
    <button id="mask-btn">进入</button>
  </div>
</div>
<script>
