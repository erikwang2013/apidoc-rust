[package]
# crates.io 上 "apidoc" 已被外部项目占用，包名用 apidoc-rust；lib 名保持 apidoc
# （宏生成的 apidoc:: 路径与消费方 use apidoc:: 均不受影响）
name = "apidoc-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "../../README.md"

[lib]
name = "apidoc"

[features]
# 默认零重型依赖（M4 红线）；axum/actix 隐含启用 mock（适配器整体交付）
mock = ["dep:fake"]
# bytes：适配器响应用的引用计数缓冲（Ui/导出产物 O(1) 克隆，不再逐请求复制全文）
axum = ["dep:axum", "dep:tower-http", "dep:bytes", "mock"]
actix = ["dep:actix-web", "dep:actix-cors", "dep:bytes", "mock"]
# P0 服务端调试：默认不启用（安全红线）。axum/actix 不隐含开启，用户显式选择。
debug-http = ["dep:reqwest", "dep:tokio"]
# P2 长连接会话桥：服务端 WebSocket 执行器 + 适配器升级路由。
debug-session = ["debug-http", "dep:async-trait", "dep:tokio-tungstenite", "dep:futures-util", "dep:actix-ws", "axum?/ws"]
# P2 原始 socket：TCP/UDP/Raw/Unix（复用 debug-http 的 tokio/guard）
debug-sockets = ["debug-http"]
# P2 Thrift：手写 TBinaryProtocol（复用 socket 传输）
debug-thrift = ["debug-sockets"]
# P2 Dubbo/Hessian2：手写编解码，复用 socket 传输（不接注册中心，P6 再说）
debug-dubbo = ["debug-sockets"]
# P2 ISO 8583：手写位图/域编解码，复用 socket 传输
debug-iso8583 = ["debug-sockets"]
# P2 gRPC：tonic 客户端 + 反射/描述符动态消息
debug-grpc = ["debug-http", "dep:tonic", "dep:prost", "dep:prost-reflect", "dep:tonic-reflection", "dep:tokio-stream"]
# P3 消息中间件：连接参数只来自请求 opts，不进 api.json
debug-mqtt = ["debug-http", "dep:rumqttc"]
debug-amqp = ["debug-http", "dep:lapin", "dep:futures-util"]
debug-kafka = ["debug-http", "dep:rskafka"]
debug-xmpp = ["debug-http", "dep:tokio-xmpp", "dep:futures-util"]
# P4 IoT/工业：CoAP 含 LwM2M；Modbus/DNP3/IEC104/BACnet/OPC UA 手写编解码
debug-coap = ["debug-http", "dep:coap-lite"]
debug-industrial = ["debug-http", "dep:tokio-modbus"]
# P5 媒体/信令：只做握手/包级调试，不转码；HTTP/3 走 QUIC
debug-media = ["debug-http", "dep:rsip"]
debug-http3 = ["debug-http", "dep:quinn", "dep:h3", "dep:h3-quinn", "dep:rustls", "dep:rustls-native-certs", "dep:http", "dep:bytes"]
# 聚合开关：显式启用全部服务端执行器；默认构建仍零重型依赖。
debug-all = ["debug-http", "debug-session", "debug-sockets", "debug-grpc", "debug-thrift", "debug-dubbo", "debug-iso8583", "debug-mqtt", "debug-amqp", "debug-kafka", "debug-xmpp", "debug-coap", "debug-industrial", "debug-media", "debug-http3"]

[dependencies]
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
# 鉴权令牌：HMAC-SHA256 签名 + URL 安全 base64（无状态令牌，不自己造密码学）
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# secret_key 缺省时的进程内随机密钥（取 OS 熵源）
getrandom = "0.2"
# M5 导出（swagger::render 返回 Value）需要；原 dev-dependency 提升为正式依赖
serde_json = "1"
# 协议定义 XML 解析：0.42 要 Rust 1.86，锁在 workspace MSRV 1.82 内
quick-xml = { version = "0.37", default-features = false }
apidoc-macros = { path = "../apidoc-macros", version = "2.1.0" }
# 以下 optional：默认构建不拉任何框架/faker 依赖
fake = { version = "3", features = ["chrono", "uuid"], optional = true }
bytes = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }
actix-web = { version = "4", features = ["macros"], optional = true }
actix-cors = { version = "0.7", optional = true }
# 服务端调试执行器（feature "debug-http"）：纯 rustls，不拉 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"], optional = true }
# P2 长连接：服务端 WS 客户端 + 适配器升级所需
async-trait = { version = "0.1", optional = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"], optional = true }
futures-util = { version = "0.3", optional = true }
actix-ws = { version = "0.3", optional = true }
# P2 gRPC（纯 Rust）
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "tls-roots"], optional = true }
prost = { version = "0.13", optional = true }
prost-reflect = { version = "0.14", features = ["serde"], optional = true }
tonic-reflection = { version = "0.12", optional = true }
tokio-stream = { version = "0.1", features = ["net", "sync"], optional = true }
# P3 消息中间件（纯 Rust；lapin 2.5+/rskafka 0.6 要 Rust 1.85，锁在 MSRV 内）
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"], optional = true }
lapin = { version = "=2.3.2", default-features = false, features = ["rustls"], optional = true }
rskafka = { version = "0.5", default-features = false, features = ["compression-gzip"], optional = true }
tokio-xmpp = { version = "4.0", optional = true }
# P4 IoT/工业
coap-lite = { version = "0.13", optional = true }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"], optional = true }
# P5 媒体/信令（quinn 0.11.11+ 要 Rust 1.85）
rsip = { version = "0.4", optional = true }
quinn = { version = "=0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
apidoc-test-fixtures = { path = "../apidoc-test-fixtures" }
# axum 集成测试（feature "axum" 时编译）
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
# latency test: per-thread CPU time excludes scheduler preemption on shared CI hosts
libc = "0.2"
# 本地 broker / h3 测试进程（仅测试目标链接，不进默认库依赖）
rumqttd = { version = "0.20", default-features = false }
rcgen = "0.13"

[[example]]
name = "axum_demo"
required-features = ["axum"]
