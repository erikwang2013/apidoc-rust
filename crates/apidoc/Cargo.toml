[package]
# crates.io 上 "apidoc" 已被外部项目占用，包名用 apidoc-rs；lib 名保持 apidoc
# （宏生成的 apidoc:: 路径与消费方 use apidoc:: 均不受影响）
name = "apidoc-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[lib]
name = "apidoc"

[dependencies]
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
# M6a 鉴权：对齐上游 apidoc-php 的 md5 组合 token（唯一允许的新增依赖）
md5 = "0.7"
# M5 导出（swagger::render 返回 Value）需要；原 dev-dependency 提升为正式依赖
serde_json = "1"
apidoc-macros = { path = "../apidoc-macros", version = "0.1.0" }

[dev-dependencies]
apidoc-test-fixtures = { path = "../apidoc-test-fixtures", version = "0.1.0" }
