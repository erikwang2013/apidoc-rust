[package]
name = "apidoc-mock"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apidoc = { path = "../apidoc", version = "0.1.0" }
# chrono/uuid faker 在 fake 3.x 按 feature 开关，date/uuid 规则需要
fake = { version = "3", features = ["chrono", "uuid"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
