<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="560" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="560" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust プロジェクト機能</text>

  <!-- 卡片 1 -->
  <rect x="40" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M1</text>
  <text x="60" y="106" font-size="17" font-weight="bold" fill="#1e8449">アノテーション式ドキュメント</text>
  <text x="60" y="130" font-size="13" fill="#333">title / desc / method / url / param / query / returned</text>
  <text x="60" y="150" font-size="13" fill="#333">7 つの属性マクロで逐条注釈（PHP attributes 相当）</text>
  <text x="60" y="170" font-size="13" fill="#333">パラメータは required / default / desc / mock / children のネスト対応</text>

  <!-- 卡片 2 -->
  <rect x="480" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M1</text>
  <text x="500" y="106" font-size="17" font-weight="bold" fill="#1e8449">コンパイル期検証</text>
  <text x="500" y="130" font-size="13" fill="#333">url は / 始まり、method はホワイトリスト、param name 必須</text>
  <text x="500" y="150" font-size="13" fill="#333">不正な注釈はコンパイル期エラー（span 正確）、コードとドキュメントの同期を維持</text>

  <!-- 卡片 3 -->
  <rect x="40" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M1</text>
  <text x="60" y="256" font-size="17" font-weight="bold" fill="#1e8449">自動収集</text>
  <text x="60" y="280" font-size="13" fill="#333">linkme distributed_slice 静的登録、API 一覧の手動管理は不要</text>
  <text x="60" y="300" font-size="13" fill="#333">DocRegistry::collect() で id マージ、seq で宣言順を復元</text>
  <text x="60" y="320" font-size="13" fill="#333">crate をまたいで自動収集、コードをスキャンすれば全 API を取得</text>

  <!-- 卡片 4 -->
  <rect x="480" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M1</text>
  <text x="500" y="256" font-size="17" font-weight="bold" fill="#1e8449">api.json 出力</text>
  <text x="500" y="280" font-size="13" fill="#333">serde で統一ドキュメントモデル（config + endpoints）をシリアライズ</text>
  <text x="500" y="300" font-size="13" fill="#333">フィールドは PHP 準拠：title/desc/url/method/params/querys/returned</text>
  <text x="500" y="320" font-size="13" fill="#333">UI 表示とエクスポートは同一データソースを共用</text>

  <!-- 卡片 5 -->
  <rect x="40" y="370" width="420" height="130" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="300" y="360" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="375" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">計画中</text>
  <text x="60" y="406" font-size="17" font-weight="bold" fill="#566573">オンラインデバッグ + Mock</text>
  <text x="60" y="430" font-size="13" fill="#333">ブラウザから CORS で対象 API に直接接続、サーバープロキシ不要</text>
  <text x="60" y="450" font-size="13" fill="#333">Mock ルール（@integer(1,100) 等）を fake crate にマップしてデータ生成</text>
  <text x="60" y="470" font-size="13" fill="#333">複数アプリ / 複数バージョン / アクセスパスワード</text>

  <!-- 卡片 6 -->
  <rect x="480" y="370" width="420" height="130" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="740" y="360" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="815" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">計画中</text>
  <text x="500" y="406" font-size="17" font-weight="bold" fill="#566573">複数フレームワーク対応 + エクスポート</text>
  <text x="500" y="430" font-size="13" fill="#333">apidoc-axum / apidoc-actix の薄いアダプタ、コアは無改変</text>
  <text x="500" y="450" font-size="13" fill="#333">Markdown / TypeScript / Swagger（OpenAPI3）のエクスポート</text>
  <text x="500" y="470" font-size="13" fill="#333">ドキュメントキャッシュ / デバッグイベント（v2：コードジェネレータ、共有リンク）</text>

  <text x="470" y="530" text-anchor="middle" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
