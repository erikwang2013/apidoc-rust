<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 815" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="815" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="815" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust プロジェクト機能（M1–M6 完了）</text>

  <!-- カード 1 -->
  <rect x="40" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M1</text>
  <text x="60" y="106" font-size="17" font-weight="bold" fill="#1e8449">アノテーション式ドキュメント</text>
  <text x="60" y="130" font-size="13" fill="#333">M1 の 7 マクロ：title / desc / method / url / param / query / returned</text>
  <text x="60" y="150" font-size="13" fill="#333">M3 で 12 個追加：tag / group / author / header / route_param /</text>
  <text x="60" y="170" font-size="12" fill="#333">response_status / success / error / not_debug / md / sort / ref</text>
  <text x="60" y="190" font-size="13" fill="#333">パラメータは required / default / desc / mock / children のネスト対応</text>

  <!-- カード 2 -->
  <rect x="480" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M1</text>
  <text x="500" y="106" font-size="17" font-weight="bold" fill="#1e8449">コンパイル期検証</text>
  <text x="500" y="130" font-size="13" fill="#333">url は / 始まり、method はホワイトリスト、param name 必須</text>
  <text x="500" y="150" font-size="13" fill="#333">不正な注釈はコンパイル期エラー（span 正確）、ドキュメントとコードの同期を維持</text>
  <text x="500" y="190" font-size="13" fill="#333">M3 の 12 個の拡張注釈も同様にフル検証</text>

  <!-- カード 3 -->
  <rect x="40" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M1</text>
  <text x="60" y="256" font-size="17" font-weight="bold" fill="#1e8449">自動収集</text>
  <text x="60" y="280" font-size="13" fill="#333">linkme distributed_slice 静的登録、API 一覧の手動管理は不要</text>
  <text x="60" y="300" font-size="13" fill="#333">DocRegistry::collect() で id マージ、seq で宣言順を復元</text>
  <text x="60" y="320" font-size="13" fill="#333">crate 横断で自動収集、コードをスキャンすれば全 API を取得</text>

  <!-- カード 4 -->
  <rect x="480" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M2</text>
  <text x="500" y="256" font-size="17" font-weight="bold" fill="#1e8449">axum / actix アダプタ + ドキュメント UI</text>
  <text x="500" y="280" font-size="13" fill="#333">apidoc-axum：/apidoc（UI）· /apidoc/api.json · /apidoc/mock</text>
  <text x="500" y="300" font-size="13" fill="#333">apidoc-actix：薄いラッパー、/apidoc/export（M5）を含む 4 ルート</text>
  <text x="500" y="320" font-size="13" fill="#333">内蔵ドキュメント UI デバッグパネル（Html 静的ページ、外部依存ゼロ）</text>

  <!-- カード 5 -->
  <rect x="40" y="370" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="360" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M4</text>
  <text x="60" y="406" font-size="17" font-weight="bold" fill="#1e8449">オンラインデバッグ + Mock エンジン</text>
  <text x="60" y="430" font-size="13" fill="#333">デバッグパネル：mock 事前入力 + ブラウザの CORS 直結で対象 API へ</text>
  <text x="60" y="450" font-size="13" fill="#333">crates/apidoc-mock エンジン：fake crate に依存してデータ生成</text>
  <text x="60" y="470" font-size="13" fill="#333">15 ルール：名前/メール/電話/IP/URL/UUID/日付/数値/浮動小数点/ブール/テキスト…</text>

  <!-- カード 6 -->
  <rect x="480" y="370" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="360" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M5</text>
  <text x="500" y="406" font-size="17" font-weight="bold" fill="#1e8449">3 形式エクスポート（M5）</text>
  <text x="500" y="430" font-size="13" fill="#333">Markdown / TypeScript / Swagger（OpenAPI 3.0）</text>
  <text x="500" y="450" font-size="13" fill="#333">info.version は VERSION ファイルから取得（ビルド時に事前シリアライズ）</text>
  <text x="500" y="470" font-size="13" fill="#333">UI / api.json / エクスポートは同一データモデルを共用</text>

  <!-- カード 7：M6a パスワード認証 -->
  <rect x="40" y="520" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="510" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M6a</text>
  <text x="60" y="556" font-size="17" font-weight="bold" fill="#1e8449">パスワード認証</text>
  <text x="60" y="580" font-size="13" fill="#333">GET /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; で token 取得</text>
  <text x="60" y="600" font-size="13" fill="#333">api.json / export / mock は ?token= 必須、欠落/期限切れ/誤りは 401</text>
  <text x="60" y="620" font-size="13" fill="#333">authcode 暗号化スイートで発行（RC4 変種 + md5 チェックサム、MAC は定数時間）</text>
  <text x="60" y="640" font-size="13" fill="#333">password / secret_key は決してシリアライズしない · アプリのパスワードがグローバルより優先</text>

  <!-- カード 8：M6b 複数アプリ・複数バージョン -->
  <rect x="480" y="520" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="510" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">実装済み M6b</text>
  <text x="500" y="556" font-size="17" font-weight="bold" fill="#1e8449">複数アプリ・複数バージョン</text>
  <text x="500" y="580" font-size="13" fill="#333">#[apidoc::app("key")] でインターフェースをマウント · ApidocConfig.apps 設定ツリー</text>
  <text x="500" y="600" font-size="13" fill="#333">api.json は doc.apps ツリーを出力（key / title / items を再帰）</text>
  <text x="500" y="620" font-size="13" fill="#333">UI 上部のアプリ/バージョンセレクタ · token は appKey ごとに localStorage へ分けて保存</text>
  <text x="500" y="640" font-size="13" fill="#333">app 未マウントのインターフェースはデフォルトアプリへ · 未設定時は M5 とバイトレベルで一致</text>

  <!-- カード 9：v2 計画 -->
  <rect x="40" y="670" width="860" height="120" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="740" y="660" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="815" y="676" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">計画中</text>
  <text x="60" y="706" font-size="17" font-weight="bold" fill="#566573">v2 計画</text>
  <text x="60" y="730" font-size="13" fill="#333">コード生成器 · データテーブルフィールド参照 · 共有リンク · デバッグイベント</text>
  <text x="60" y="750" font-size="13" fill="#333">アダプタ：axum / actix ともにカバー（機能 1:1）</text>
  <text x="60" y="770" font-size="13" fill="#333">M1–M6 はすべて完了（パスワード認証 · 複数アプリ・複数バージョン含む）</text>

  <text x="470" y="805" text-anchor="middle" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
