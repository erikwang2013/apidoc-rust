<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 815" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="815" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="815" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust 프로젝트 기능 (M1–M6 완료)</text>

  <!-- 카드 1 -->
  <rect x="40" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">구현됨 M1</text>
  <text x="60" y="106" font-size="17" font-weight="bold" fill="#1e8449">주석 기반 문서</text>
  <text x="60" y="130" font-size="13" fill="#333">M1 기본 7개: title / desc / method / url / param / query / returned</text>
  <text x="60" y="150" font-size="13" fill="#333">M3 추가 12개: tag / group / author / header / route_param /</text>
  <text x="60" y="170" font-size="12" fill="#333">response_status / success / error / not_debug / md / sort / ref</text>
  <text x="60" y="190" font-size="13" fill="#333">파라미터는 required / default / desc / mock / children 중첩 지원</text>

  <!-- 카드 2 -->
  <rect x="480" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">구현됨 M1</text>
  <text x="500" y="106" font-size="17" font-weight="bold" fill="#1e8449">컴파일 타임 검증</text>
  <text x="500" y="130" font-size="13" fill="#333">url은 /로 시작, method 화이트리스트, param name 필수</text>
  <text x="500" y="150" font-size="13" fill="#333">잘못된 주석은 컴파일 타임 오류(span 정밀), 문서와 코드 동기화 유지</text>
  <text x="500" y="190" font-size="13" fill="#333">M3 확장 12개 주석도 전량 검증</text>

  <!-- 카드 3 -->
  <rect x="40" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">구현됨 M1</text>
  <text x="60" y="256" font-size="17" font-weight="bold" fill="#1e8449">자동 수집</text>
  <text x="60" y="280" font-size="13" fill="#333">linkme distributed_slice 정적 등록, 수동 인터페이스 목록 불필요</text>
  <text x="60" y="300" font-size="13" fill="#333">DocRegistry::collect()로 id별 병합, seq로 선언 순서 복원</text>
  <text x="60" y="320" font-size="13" fill="#333">크로스 crate 자동 수집, "코드 스캔 = 전체 인터페이스"와 동일</text>

  <!-- 카드 4 -->
  <rect x="480" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">구현됨 M2</text>
  <text x="500" y="256" font-size="17" font-weight="bold" fill="#1e8449">axum / actix 어댑터 + 문서 UI</text>
  <text x="500" y="280" font-size="13" fill="#333">apidoc-axum: /apidoc(UI) · /apidoc/api.json · /apidoc/mock</text>
  <text x="500" y="300" font-size="13" fill="#333">apidoc-actix: 얇은 래퍼, /apidoc/export(M5) 포함 4개 라우트</text>
  <text x="500" y="320" font-size="13" fill="#333">내장 문서 UI 디버깅 패널(정적 Html, 외부 의존성 0)</text>

  <!-- 카드 5 -->
  <rect x="40" y="370" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="360" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">구현됨 M4</text>
  <text x="60" y="406" font-size="17" font-weight="bold" fill="#1e8449">온라인 디버깅 + Mock 엔진</text>
  <text x="60" y="430" font-size="13" fill="#333">디버깅 패널: mock 프리필 + 브라우저 CORS 직접 연결</text>
  <text x="60" y="450" font-size="13" fill="#333">crates/apidoc-mock 엔진: fake crate 의존으로 데이터 생성</text>
  <text x="60" y="470" font-size="13" fill="#333">15개 규칙: 이름/이메일/전화/IP/URL/UUID/날짜/숫자/실수/불리언/텍스트…</text>

  <!-- 카드 6 -->
  <rect x="480" y="370" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="360" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">구현됨 M5</text>
  <text x="500" y="406" font-size="17" font-weight="bold" fill="#1e8449">3형식 내보내기(M5)</text>
  <text x="500" y="430" font-size="13" fill="#333">Markdown / TypeScript / Swagger(OpenAPI 3.0)</text>
  <text x="500" y="450" font-size="13" fill="#333">info.version은 VERSION 파일에서 가져옴(빌드 시 사전 직렬화)</text>
  <text x="500" y="470" font-size="13" fill="#333">UI / api.json / 내보내기 동일 데이터 모델 공용</text>

  <!-- 카드 7: M6a 비밀번호 인증 -->
  <rect x="40" y="520" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="510" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">구현됨 M6a</text>
  <text x="60" y="556" font-size="17" font-weight="bold" fill="#1e8449">비밀번호 인증</text>
  <text x="60" y="580" font-size="13" fill="#333">GET /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt;로 token 교환</text>
  <text x="60" y="600" font-size="13" fill="#333">api.json / export / mock은 ?token= 필수, 누락/만료/오류는 401</text>
  <text x="60" y="620" font-size="13" fill="#333">authcode 암호화 스위트 발급(RC4 변형 + md5 체크섬, MAC 상수 시간)</text>
  <text x="60" y="640" font-size="13" fill="#333">password / secret_key는 절대 직렬화하지 않음 · 앱 비밀번호가 전역보다 우선</text>

  <!-- 카드 8: M6b 다중 앱·다중 버전 -->
  <rect x="480" y="520" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="510" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">구현됨 M6b</text>
  <text x="500" y="556" font-size="17" font-weight="bold" fill="#1e8449">다중 앱·다중 버전</text>
  <text x="500" y="580" font-size="13" fill="#333">#[apidoc::app("key")]로 인터페이스 마운트 · ApidocConfig.apps 설정 트리</text>
  <text x="500" y="600" font-size="13" fill="#333">api.json은 doc.apps 트리 출력(key / title / items 재귀)</text>
  <text x="500" y="620" font-size="13" fill="#333">UI 상단 앱/버전 선택기 · token은 appKey별로 localStorage에 분리 저장</text>
  <text x="500" y="640" font-size="13" fill="#333">app 미마운트 인터페이스는 기본 앱으로 · 미설정 시 M5와 바이트 수준 일치</text>

  <!-- 카드 9: v2 계획 -->
  <rect x="40" y="670" width="860" height="120" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="740" y="660" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="815" y="676" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">계획 중</text>
  <text x="60" y="706" font-size="17" font-weight="bold" fill="#566573">v2 계획</text>
  <text x="60" y="730" font-size="13" fill="#333">코드 생성기 · 데이터 테이블 필드 참조 · 공유 링크 · 디버그 이벤트</text>
  <text x="60" y="750" font-size="13" fill="#333">어댑터: axum / actix 모두 커버(기능 1:1)</text>
  <text x="60" y="770" font-size="13" fill="#333">M1–M6 전부 완료(비밀번호 인증 · 다중 앱·다중 버전 포함)</text>

  <text x="470" y="805" text-anchor="middle" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
