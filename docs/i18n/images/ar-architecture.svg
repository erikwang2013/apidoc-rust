<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="720" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="720" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">البنية العامة لـ apidoc-rust (اكتمل M6)</text>

  <!-- طبقة كود المستخدم -->
  <rect x="120" y="62" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="140" y="88" font-size="17" font-weight="bold" fill="#5f4b00">طبقة كود المستخدم</text>
  <text x="140" y="112" font-size="13" fill="#333" font-family="monospace">#[apidoc::title(...)]  #[apidoc::method("GET")]  #[apidoc::param(name="id", ty="int", required)] ...</text>

  <!-- زمن الترجمة -->
  <rect x="120" y="138" width="700" height="72" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <rect x="724" y="144" width="96" height="22" rx="11" fill="#6c5ce7"/>
  <text x="772" y="159" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M1+M3+M6</text>
  <text x="140" y="164" font-size="17" font-weight="bold" fill="#3d2f9e">زمن الترجمة · apidoc-macros (proc-macro)</text>
  <text x="140" y="188" font-size="12" fill="#333">20 ماكرو سمات: 7 أساسية من M1 (title/desc/method/url/param/query/returned) + 12 موسعة من M3 (tag/group/author/header/route_param/response_status/success/error/not_debug/md/sort/ref) + تركيب التطبيق من M6</text>
  <text x="140" y="204" font-size="12" fill="#555">جميعها تتضمن تحققًا من المعاملات في زمن الترجمة (url يبدأ بـ /، method ضمن قائمة بيضاء، param name إلزامي)، والغير صالح يسبب خطأ ترجمة فورًا</text>

  <!-- التسجيل -->
  <rect x="250" y="222" width="440" height="46" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <rect x="610" y="227" width="62" height="20" rx="10" fill="#f39c12"/>
  <text x="641" y="241" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1</text>
  <text x="470" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d5200">تسجيل ثابت عبر linkme distributed_slice</text>
  <text x="470" y="263" text-anchor="middle" font-size="12" fill="#555">توليد DocFragmentEntry في زمن الترجمة، جمع بلا تكلفة في زمن التشغيل، وتجميع تلقائي عبر crates</text>

  <!-- النواة في زمن التشغيل -->
  <rect x="120" y="280" width="700" height="58" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <rect x="730" y="285" width="64" height="20" rx="10" fill="#2980b9"/>
  <text x="762" y="299" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1+M6</text>
  <text x="140" y="308" font-size="17" font-weight="bold" fill="#1a5276">النواة في زمن التشغيل · apidoc (مستقلة عن الإطار)</text>
  <text x="140" y="330" font-size="13" fill="#333">DocRegistry::collect() تدمج القطع حسب id وتستعيد ترتيب التعريف حسب seq → نموذج بيانات ApiDoc</text>
  <text x="140" y="346" font-size="13" fill="#555" font-family="monospace">→ api.json (تسلسل serde، تشترك فيه واجهة العرض والتصدير؛ M6b يتضمن شجرة doc.apps) → تصدير: md / ts / swagger (OpenAPI3)</text>

  <!-- المصادقة (M6a) -->
  <rect x="120" y="350" width="700" height="40" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <rect x="730" y="354" width="62" height="20" rx="10" fill="#c0392b"/>
  <text x="761" y="368" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M6a</text>
  <text x="140" y="368" font-size="13" fill="#333" font-family="monospace">auth.rs: GET /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; للحصول على token (تشفير authcode؛ password/secret_key لا تُسلسل أبدًا)</text>

  <!-- طبقة المحولات: مكتملة -->
  <rect x="120" y="402" width="700" height="76" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="708" y="407" width="112" height="22" rx="11" fill="#27ae60"/>
  <text x="764" y="422" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M2+M4+M5+M6</text>
  <text x="140" y="428" font-size="16" font-weight="bold" fill="#1e8449">طبقة المحولات (مكتملة) · apidoc-axum + apidoc-actix: تركيب المسارات + CORS</text>
  <!-- actix مكتمل -->
  <rect x="656" y="434" width="148" height="24" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="2"/>
  <text x="730" y="450" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">apidoc-actix (مكتمل)</text>
  <text x="140" y="452" font-size="13" fill="#333">/apidoc (واجهة العرض) · /apidoc/api.json · /apidoc/mock · /apidoc/export · /apidoc/auth (M6a الحصول على token)</text>
  <text x="140" y="470" font-size="13" fill="#333">api.json / export / mock تتطلب ?token=؛ الغائب/المنتهي/الخاطئ يرجع 401؛ وعند تعطيل auth: 404، وتمرر مسارات البيانات مباشرة</text>

  <!-- طبقة العرض: مكتملة -->
  <rect x="120" y="490" width="700" height="64" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="708" y="495" width="84" height="20" rx="10" fill="#27ae60"/>
  <text x="750" y="509" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4+M6</text>
  <text x="140" y="515" font-size="16" font-weight="bold" fill="#1e8449">طبقة العرض (مكتملة) · لوحة تصحيح واجهة الوثائق (Html مدمج بلا تبعيات خارجية)</text>
  <text x="140" y="537" font-size="13" fill="#333">تصفح الفهرس / تصحيح أونلاين (اتصال مباشر عبر CORS) / تعبئة Mock مسبقًا</text>
  <text x="140" y="553" font-size="13" fill="#333">M6: قناع كلمة المرور (md5 من الواجهة للحصول على token) · منتقي التطبيق/الإصدار · تخزين token حسب appKey في localStorage</text>

  <!-- تدفق البيانات -->
  <rect x="120" y="566" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <rect x="708" y="571" width="84" height="20" rx="10" fill="#b58900"/>
  <text x="750" y="585" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4+M6</text>
  <text x="140" y="588" font-size="13" fill="#333" font-family="monospace">المتصفح → /apidoc (لوحة التصحيح) → اتصال مباشر عبر CORS → الواجهة الهدف (طلب حقيقي)</text>
  <text x="140" y="606" font-size="13" fill="#333" font-family="monospace">المتصفح → /apidoc/mock → بيانات Mock (fake crate · 15 قاعدة)</text>
  <text x="140" y="622" font-size="13" fill="#333" font-family="monospace">المتصفح → /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; → token، ثم الوصول إلى مسارات البيانات عبر ?token=</text>

  <!-- workspace -->
  <rect x="120" y="642" width="700" height="26" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2"/>
  <text x="470" y="660" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">workspace: apidoc (النواة·auth.rs) · macros (الماكرو) · axum (المحول) · actix (المحول) · mock (Mock) · test-fixtures (نماذج الاختبار)</text>

  <!-- المفتاح -->
  <rect x="120" y="678" width="24" height="12" fill="#27ae60"/>
  <text x="152" y="689" font-size="13" fill="#333">تم تنفيذه (M1–M6)</text>
  <rect x="310" y="678" width="24" height="12" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="342" y="689" font-size="13" fill="#333">قيد التخطيط (v2: مولّد أكواد / روابط مشاركة إلخ)</text>
  <text x="700" y="689" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
