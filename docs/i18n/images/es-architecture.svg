<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 860" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="860" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="860" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust Overall Architecture (M1–M6 + P1–P6 + UIC-1)</text>
  <text x="470" y="60" text-anchor="middle" font-size="13" fill="#555">Annotations → document model → UIC-1 contract / adapters → browser-direct / relay → exports &amp; integrations</text>

  <!-- User code -->
  <rect x="60" y="78" width="820" height="74" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="80" y="104" font-size="16" font-weight="bold" fill="#5f4b00">User code layer</text>
  <text x="80" y="126" font-size="12.5" fill="#333" font-family="monospace">#[apidoc::title] #[apidoc::method] #[apidoc::param] #[apidoc::returned]</text>
  <text x="80" y="144" font-size="12.5" fill="#333" font-family="monospace">#[apidoc::grpc(...)] #[apidoc::websocket(...)] #[apidoc::event(...)] #[apidoc::definition(...)]</text>

  <!-- Compile time -->
  <rect x="60" y="164" width="820" height="86" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <text x="80" y="190" font-size="16" font-weight="bold" fill="#3d2f9e">Compile time · apidoc-macros (proc-macro)</text>
  <text x="80" y="212" font-size="12.5" fill="#333">24 base annotations + 45 protocol aliases (incl. definition); kind / args / fields checked at compile time</text>
  <text x="80" y="230" font-size="12.5" fill="#555">linkme distributed_slice emits DocFragmentEntry; cross-crate collection at zero runtime cost</text>

  <!-- Runtime core -->
  <rect x="60" y="264" width="820" height="86" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="290" font-size="16" font-weight="bold" fill="#1a5276">Runtime core · apidoc (framework-agnostic)</text>
  <text x="80" y="312" font-size="12.5" fill="#333">DocRegistry::collect() merges fragments by id, restores declaration order by seq → api.json / UIC-1 detail</text>
  <text x="80" y="330" font-size="12.5" fill="#555">HMAC auth · app tree · protocol registry · 9 definition parsers · exports / mocks materialized at build</text>

  <!-- Adapters -->
  <rect x="60" y="364" width="820" height="74" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="80" y="390" font-size="16" font-weight="bold" fill="#1e8449">Adapters · axum / actix-web · native UI / Vue static build</text>
  <text x="80" y="412" font-size="12.5" fill="#333" font-family="monospace">/apidoc · api.json · export · mock · auth · share · generate</text>
  <text x="80" y="430" font-size="12.5" fill="#333" font-family="monospace">/apidoc/debug · /apidoc/ui/v1/* · /apidoc/webhook/:id · CORS</text>

  <!-- Browser direct -->
  <rect x="60" y="452" width="400" height="154" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="80" y="478" font-size="15" font-weight="bold" fill="#1e8449">P1 · Browser-direct</text>
  <text x="80" y="502" font-size="12" fill="#333">SOAP · GraphQL · JSON-RPC · XML-RPC · OData</text>
  <text x="80" y="522" font-size="12" fill="#333">MCP · A2A · Webhooks · SSE · Socket.IO</text>
  <text x="80" y="542" font-size="12" fill="#333">WebSocket (text/binary) · STOMP · GraphQL-WS</text>
  <text x="80" y="562" font-size="12" fill="#333">WebRTC / DataChannel · HLS preview</text>
  <text x="80" y="586" font-size="12" fill="#1e8449">No Rust deps · auth via URL query · pre/post scripts</text>

  <!-- Server executors -->
  <rect x="480" y="452" width="400" height="154" rx="8" fill="#eaf1fe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="478" font-size="15" font-weight="bold" fill="#1d4ed8">P2–P5 · Server executors</text>
  <text x="500" y="502" font-size="12" fill="#333">HTTP/2 · HTTP/3 · gRPC · Thrift · Dubbo/Hessian2</text>
  <text x="500" y="522" font-size="12" fill="#333">ISO 8583 · RTP/RTCP · RTSP · SIP · RTMP</text>
  <text x="500" y="542" font-size="12" fill="#333">TCP/UDP/Raw/Unix · MQTT · AMQP · Kafka</text>
  <text x="500" y="562" font-size="12" fill="#333">XMPP · STOMP/TCP · CoAP · LwM2M</text>
  <text x="500" y="582" font-size="12" fill="#333">Modbus · DNP3 · IEC 104 · BACnet/IP · OPC UA</text>
  <text x="500" y="600" font-size="11.5" fill="#1d4ed8">One feature per protocol family · debug-all aggregates</text>

  <!-- Security -->
  <rect x="60" y="616" width="820" height="76" rx="8" fill="#fdeeee" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="642" font-size="16" font-weight="bold" fill="#991b1b">Security &amp; runtime boundaries</text>
  <text x="80" y="664" font-size="12.5" fill="#333">DebugConfig is off by default; enabling requires global auth; SSRF guard validates every IP and pins connections</text>
  <text x="80" y="682" font-size="12.5" fill="#333">No redirects/proxy/CONNECT · size/frame/timeout caps · DNP3/IEC104 10,000 limits · no pinned TLS = fail closed</text>

  <!-- Exports -->
  <rect x="60" y="702" width="820" height="74" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="80" y="728" font-size="16" font-weight="bold" fill="#5f4b00">Exports &amp; integrations</text>
  <text x="80" y="750" font-size="12.5" fill="#333">md / ts / swagger(OpenAPI 3.0) / asyncapi(2.6) · codegen · Mock · share links · UIC-1 exports</text>
  <text x="80" y="768" font-size="12.5" fill="#555">UIC-1 9 definition formats · Vue static UI · full relay · apidoc-idl import · Nacos · Webhook</text>

  <!-- workspace -->
  <rect x="60" y="786" width="820" height="26" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2"/>
  <text x="470" y="804" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">workspace: apidoc · apidoc-macros · apidoc-idl · apidoc-test-fixtures</text>

  <!-- legend -->
  <rect x="60" y="826" width="22" height="12" fill="#27ae60"/>
  <text x="90" y="837" font-size="12.5" fill="#333">Implemented (M1–M6 + P1–P6 + UIC-1)</text>
  <text x="330" y="837" font-size="12.5" fill="#555">Server debugging off by default · browser-direct needs no deps · see multiprotocol-en.svg</text>
  <text x="700" y="850" font-size="12" fill="#888">watermark: https://erik.xyz</text>
</svg>
