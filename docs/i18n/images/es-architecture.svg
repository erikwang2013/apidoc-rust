<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="600" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="600" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">Arquitectura general de apidoc-rust</text>

  <!-- Capa de código de usuario -->
  <rect x="120" y="62" width="700" height="72" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="140" y="90" font-size="17" font-weight="bold" fill="#5f4b00">Capa de código de usuario</text>
  <text x="140" y="114" font-size="13" fill="#333" font-family="monospace">#[apidoc::title(...)]  #[apidoc::method("GET")]  #[apidoc::param(name="id", ty="int", required)] ...</text>
  <text x="470" y="146" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Tiempo de compilación -->
  <rect x="120" y="156" width="700" height="66" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <text x="140" y="184" font-size="17" font-weight="bold" fill="#3d2f9e">Tiempo de compilación · apidoc-macros (proc-macro)</text>
  <text x="140" y="207" font-size="13" fill="#333">7 macros de atributo: title / desc / method / url / param / query / returned (con validación de parámetros en tiempo de compilación)</text>
  <text x="470" y="234" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Registro -->
  <rect x="250" y="244" width="440" height="52" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="470" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d5200">Registro estático con linkme distributed_slice</text>
  <text x="470" y="287" text-anchor="middle" font-size="12" fill="#555">DocFragmentEntry generado en tiempo de compilación; recolección con costo de ejecución cero</text>
  <text x="470" y="308" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Núcleo en tiempo de ejecución -->
  <rect x="120" y="318" width="700" height="72" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <text x="140" y="346" font-size="17" font-weight="bold" fill="#1a5276">Núcleo en tiempo de ejecución · apidoc (independiente del framework)</text>
  <text x="140" y="370" font-size="13" fill="#333">DocRegistry::collect() fusiona fragmentos por id y restaura el orden de declaración por seq → modelo de datos ApiDoc</text>
  <text x="140" y="386" font-size="13" fill="#555" font-family="monospace">→ api.json (serialización serde, compartido por la UI y la exportación)</text>
  <text x="470" y="402" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Capa de adaptadores, planificada -->
  <rect x="120" y="412" width="700" height="62" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="440" font-size="16" font-weight="bold" fill="#566573">Capa de adaptadores (planificada) · encapsulado fino, núcleo sin cambios</text>
  <text x="140" y="462" font-size="13" fill="#333">apidoc-axum / apidoc-actix: montaje de rutas, cabeceras CORS</text>
  <text x="470" y="486" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Capa de presentación, planificada -->
  <rect x="120" y="496" width="700" height="66" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="524" font-size="16" font-weight="bold" fill="#566573">Capa de presentación (planificada) · UI de documentación</text>
  <text x="140" y="547" font-size="13" fill="#333">Exploración de directorios / depuración en línea (CORS directo) / datos Mock / exportar Markdown · TypeScript · Swagger</text>

  <!-- Leyenda -->
  <rect x="120" y="572" width="24" height="12" fill="#2980b9"/>
  <text x="152" y="583" font-size="13" fill="#333">Implementado (M1)</text>
  <rect x="300" y="572" width="24" height="12" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="332" y="583" font-size="13" fill="#333">Planificado</text>
  <text x="700" y="583" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
