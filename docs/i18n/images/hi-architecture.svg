<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="600" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="600" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust समग्र वास्तुकला (M4 पूर्ण)</text>

  <!-- उपयोगकर्ता कोड परत -->
  <rect x="120" y="62" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="140" y="88" font-size="17" font-weight="bold" fill="#5f4b00">उपयोगकर्ता कोड परत</text>
  <text x="140" y="112" font-size="13" fill="#333" font-family="monospace">#[apidoc::title(...)]  #[apidoc::method("GET")]  #[apidoc::param(name="id", ty="int", required)] ...</text>

  <!-- संकलन समय -->
  <rect x="120" y="138" width="700" height="72" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <rect x="730" y="144" width="76" height="22" rx="11" fill="#6c5ce7"/>
  <text x="768" y="159" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M1 + M3</text>
  <text x="140" y="164" font-size="17" font-weight="bold" fill="#3d2f9e">संकलन समय · apidoc-macros (proc-macro)</text>
  <text x="140" y="188" font-size="12" fill="#333">19 एट्रिब्यूट मैक्रो: M1 की 7 आधार (title/desc/method/url/param/query/returned) + M3 की 12 विस्तार (tag/group/author/header/route_param/response_status/success/error/not_debug/md/sort/ref)</text>
  <text x="140" y="204" font-size="12" fill="#555">सभी में संकलन-समय पैरामीटर सत्यापन (url / से शुरू, method श्वेतसूची, param name अनिवार्य); अवैध एनोटेशन सीधे संकलन त्रुटि देते हैं</text>

  <!-- पंजीकरण -->
  <rect x="250" y="222" width="440" height="46" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <rect x="610" y="227" width="62" height="20" rx="10" fill="#f39c12"/>
  <text x="641" y="241" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1</text>
  <text x="470" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d5200">linkme distributed_slice स्थैतिक पंजीकरण</text>
  <text x="470" y="263" text-anchor="middle" font-size="12" fill="#555">संकलन-समय DocFragmentEntry उत्पन्न, शून्य-रनटाइम-लागत संग्रह, क्रॉस-crate स्वतः एकत्रीकरण</text>

  <!-- रनटाइम कोर -->
  <rect x="120" y="280" width="700" height="58" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <rect x="730" y="285" width="62" height="20" rx="10" fill="#2980b9"/>
  <text x="761" y="299" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1</text>
  <text x="140" y="308" font-size="17" font-weight="bold" fill="#1a5276">रनटाइम कोर · apidoc (फ्रेमवर्क-स्वतंत्र)</text>
  <text x="140" y="330" font-size="13" fill="#333">DocRegistry::collect() id से टुकड़ों को मर्ज करता है, seq से घोषणा क्रम पुनर्स्थापित करता है → ApiDoc डेटा मॉडल</text>
  <text x="140" y="346" font-size="13" fill="#555" font-family="monospace">→ api.json (serde क्रमांकन, UI और निर्यात के लिए साझा)</text>

  <!-- अडैप्टर परत, पूर्ण -->
  <rect x="120" y="350" width="700" height="62" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="656" y="355" width="76" height="22" rx="11" fill="#27ae60"/>
  <text x="694" y="370" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M2 + M4</text>
  <text x="140" y="376" font-size="16" font-weight="bold" fill="#1e8449">अडैप्टर परत (पूर्ण) · apidoc-axum: रूट माउंटिंग + CORS, कोर में कोई बदलाव नहीं</text>
  <text x="140" y="398" font-size="13" fill="#333">/apidoc (UI डिबग पैनल) · /apidoc/api.json (दस्तावेज़ डेटा) · /apidoc/mock (मॉक इंजन)</text>
  <!-- actix नियोजित -->
  <rect x="656" y="384" width="148" height="24" rx="6" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="730" y="400" text-anchor="middle" font-size="12" fill="#566573">apidoc-actix (नियोजित)</text>

  <!-- प्रदर्शन परत, पूर्ण -->
  <rect x="120" y="424" width="700" height="50" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="730" y="429" width="62" height="20" rx="10" fill="#27ae60"/>
  <text x="761" y="443" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4</text>
  <text x="140" y="449" font-size="16" font-weight="bold" fill="#1e8449">प्रदर्शन परत (पूर्ण) · दस्तावेज़ UI डिबग पैनल (एम्बेडेड Html, शून्य बाहरी निर्भरता)</text>
  <text x="140" y="467" font-size="13" fill="#333">कैटलॉग ब्राउज़िंग / ऑनलाइन डिबगिंग (सीधा CORS) / मॉक प्री-फिल</text>

  <!-- डेटा फ़्लो -->
  <rect x="120" y="486" width="700" height="44" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <rect x="730" y="491" width="62" height="20" rx="10" fill="#b58900"/>
  <text x="761" y="505" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4</text>
  <text x="140" y="508" font-size="13" fill="#333" font-family="monospace">ब्राउज़र → /apidoc (डिबग पैनल) → CORS सीधा कनेक्शन → लक्ष्य इंटरफ़ेस (वास्तविक अनुरोध)</text>
  <text x="140" y="524" font-size="13" fill="#333" font-family="monospace">ब्राउज़र → /apidoc/mock → मॉक डेटा (fake crate · 15 नियम)</text>

  <!-- workspace -->
  <rect x="120" y="542" width="700" height="26" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2"/>
  <text x="470" y="560" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">workspace: apidoc (कोर) · apidoc-macros (मैक्रो) · apidoc-axum (अडैप्टर) · apidoc-mock (मॉक·fake) · apidoc-test-fixtures (टेस्ट फिक्स्चर)</text>

  <!-- लीजेंड -->
  <rect x="120" y="578" width="24" height="12" fill="#27ae60"/>
  <text x="152" y="589" font-size="13" fill="#333">कार्यान्वित (M1–M4)</text>
  <rect x="310" y="578" width="24" height="12" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="342" y="589" font-size="13" fill="#333">नियोजित (M5 निर्यात / M6 एकाधिक ऐप-संस्करण / actix)</text>
  <text x="700" y="589" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
