<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="940" height="500" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="500" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust Documentation Lifecycle (M1–M6 + P1–P6 + UIC-1)</text>

  <!-- 1 -->
  <circle cx="85" cy="150" r="34" fill="#b58900"/>
  <text x="85" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">1</text>
  <text x="85" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Write annotations</text>
  <text x="85" y="235" text-anchor="middle" font-size="12" fill="#555">on handler fn</text>
  <text x="85" y="252" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">#[apidoc::*]</text>
  <text x="85" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1</text>

  <line x1="125" y1="150" x2="160" y2="150" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <circle cx="200" cy="150" r="34" fill="#6c5ce7"/>
  <text x="200" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">2</text>
  <text x="200" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Macro expansion</text>
  <text x="200" y="235" text-anchor="middle" font-size="12" fill="#555">compile-time codegen</text>
  <text x="200" y="252" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">DocFragmentEntry</text>
  <text x="200" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1</text>

  <line x1="240" y1="150" x2="275" y2="150" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <circle cx="315" cy="150" r="34" fill="#f39c12"/>
  <text x="315" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">3</text>
  <text x="315" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">linkme registry</text>
  <text x="315" y="235" text-anchor="middle" font-size="12" fill="#555">distributed slice</text>
  <text x="315" y="252" text-anchor="middle" font-size="12" fill="#555">zero runtime cost</text>
  <text x="315" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1</text>

  <line x1="355" y1="150" x2="390" y2="150" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <circle cx="430" cy="150" r="34" fill="#2980b9"/>
  <text x="430" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">4</text>
  <text x="430" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">collect() merge</text>
  <text x="430" y="235" text-anchor="middle" font-size="12" fill="#555">by id + seq order</text>
  <text x="430" y="252" text-anchor="middle" font-size="12" fill="#555">fragments</text>
  <text x="430" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1</text>

  <line x1="470" y1="150" x2="505" y2="150" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <circle cx="545" cy="150" r="34" fill="#27ae60"/>
  <text x="545" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">5</text>
  <text x="545" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">api.json</text>
  <text x="545" y="235" text-anchor="middle" font-size="11" fill="#555">+ UIC-1 contract</text>
  <text x="545" y="252" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">config · endpoints</text>
  <text x="545" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1·M6·UIC-1</text>

  <line x1="579" y1="150" x2="856" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 6 -->
  <circle cx="890" cy="310" r="34" fill="#c0392b"/>
  <text x="890" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">6</text>
  <text x="880" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Auth token</text>
  <text x="880" y="395" text-anchor="middle" font-size="12" fill="#555">POST password</text>
  <text x="880" y="412" text-anchor="middle" font-size="12" fill="#555">?token= required</text>
  <text x="880" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M6a · 401</text>

  <line x1="850" y1="310" x2="815" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 7 -->
  <circle cx="775" cy="310" r="34" fill="#34495e"/>
  <text x="775" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">7</text>
  <text x="775" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">App render</text>
  <text x="775" y="395" text-anchor="middle" font-size="12" fill="#555">app/version picker</text>
  <text x="775" y="412" text-anchor="middle" font-size="12" fill="#555">token per appKey</text>
  <text x="775" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M6b</text>

  <line x1="735" y1="310" x2="700" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 8 -->
  <circle cx="660" cy="310" r="34" fill="#16a085"/>
  <text x="660" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">8</text>
  <text x="660" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">UI: native / Vue</text>
  <text x="660" y="395" text-anchor="middle" font-size="12" fill="#555">menus · detail · docs</text>
  <text x="660" y="412" text-anchor="middle" font-size="12" fill="#555">definitions · debug</text>
  <text x="660" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M2·M4·UIC-1</text>

  <line x1="620" y1="310" x2="585" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 9 -->
  <circle cx="545" cy="310" r="34" fill="#e67e22"/>
  <text x="545" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">9</text>
  <text x="545" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Debug flow</text>
  <text x="545" y="395" text-anchor="middle" font-size="12" fill="#555">CORS direct</text>
  <text x="545" y="412" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">/apidoc/mock</text>
  <text x="545" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M4</text>

  <line x1="505" y1="310" x2="470" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 10 -->
  <circle cx="430" cy="310" r="34" fill="#8e44ad"/>
  <text x="430" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">10</text>
  <text x="430" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Four exports</text>
  <text x="430" y="395" text-anchor="middle" font-size="12" fill="#555">md / ts / swagger</text>
  <text x="430" y="412" text-anchor="middle" font-size="12" fill="#555">asyncapi · OpenAPI</text>
  <text x="430" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M5·P6</text>

  <!-- legend -->
  <text x="470" y="455" text-anchor="middle" font-size="13" fill="#333">Milestones: M1 annotations/collection · M2 adapters &amp; UI · M4 debug/Mock/CORS · M5 exports · M6 auth/multi-app</text>
  <text x="470" y="473" text-anchor="middle" font-size="13" fill="#333">P1–P6 + UIC-1: annotations · browser-direct · relay · 9 definition formats · Vue UI · Webhook · AsyncAPI · IDL · Nacos</text>
  <text x="700" y="492" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
