<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="720" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="720" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust 전체 아키텍처 (M6 완료)</text>

  <!-- 사용자 코드 계층 -->
  <rect x="120" y="62" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="140" y="88" font-size="17" font-weight="bold" fill="#5f4b00">사용자 코드 계층</text>
  <text x="140" y="112" font-size="13" fill="#333" font-family="monospace">#[apidoc::title(...)]  #[apidoc::method("GET")]  #[apidoc::param(name="id", ty="int", required)] ...</text>

  <!-- 컴파일 타임 -->
  <rect x="120" y="138" width="700" height="72" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <rect x="724" y="144" width="96" height="22" rx="11" fill="#6c5ce7"/>
  <text x="772" y="159" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M1+M3+M6</text>
  <text x="140" y="164" font-size="17" font-weight="bold" fill="#3d2f9e">컴파일 타임 · apidoc-macros(proc-macro)</text>
  <text x="140" y="188" font-size="12" fill="#333">속성 매크로 20개: M1 기본 7개(title/desc/method/url/param/query/returned) + M3 확장 12개(tag/group/author/header/route_param/response_status/success/error/not_debug/md/sort/ref) + M6 app 마운트</text>
  <text x="140" y="204" font-size="12" fill="#555">모두 컴파일 타임 파라미터 검증 포함(url은 /로 시작, method 화이트리스트, param name 필수), 잘못된 주석은 컴파일 오류</text>

  <!-- 등록 -->
  <rect x="250" y="222" width="440" height="46" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <rect x="610" y="227" width="62" height="20" rx="10" fill="#f39c12"/>
  <text x="641" y="241" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1</text>
  <text x="470" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d5200">linkme distributed_slice 정적 등록</text>
  <text x="470" y="263" text-anchor="middle" font-size="12" fill="#555">컴파일 타임에 DocFragmentEntry 생성, 제로 비용 수집, 크로스 crate 자동 집계</text>

  <!-- 런타임 코어 -->
  <rect x="120" y="280" width="700" height="58" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <rect x="730" y="285" width="64" height="20" rx="10" fill="#2980b9"/>
  <text x="762" y="299" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1+M6</text>
  <text x="140" y="308" font-size="17" font-weight="bold" fill="#1a5276">런타임 코어 · apidoc(프레임워크 무관)</text>
  <text x="140" y="330" font-size="13" fill="#333">DocRegistry::collect()로 id별 조각 병합, seq로 선언 순서 복원 → ApiDoc 데이터 모델</text>
  <text x="140" y="346" font-size="13" fill="#555" font-family="monospace">→ api.json(serde 직렬화, UI와 내보내기 공용; M6b는 doc.apps 트리 포함) → 내보내기: md / ts / swagger(OpenAPI3)</text>

  <!-- 인증(M6a) -->
  <rect x="120" y="350" width="700" height="40" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <rect x="730" y="354" width="62" height="20" rx="10" fill="#c0392b"/>
  <text x="761" y="368" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M6a</text>
  <text x="140" y="368" font-size="13" fill="#333" font-family="monospace">auth.rs: GET /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt;로 token 교환(authcode 암호화 스위트, password/secret_key는 절대 직렬화하지 않음)</text>

  <!-- 어댑터 계층 완료 -->
  <rect x="120" y="402" width="700" height="76" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="708" y="407" width="112" height="22" rx="11" fill="#27ae60"/>
  <text x="764" y="422" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M2+M4+M5+M6</text>
  <text x="140" y="428" font-size="16" font-weight="bold" fill="#1e8449">어댑터 계층(완료) · apidoc-axum + apidoc-actix: 라우트 마운트 + CORS</text>
  <!-- actix 완료 -->
  <rect x="656" y="434" width="148" height="24" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="2"/>
  <text x="730" y="450" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">apidoc-actix(완료)</text>
  <text x="140" y="452" font-size="13" fill="#333">/apidoc(UI) · /apidoc/api.json · /apidoc/mock · /apidoc/export · /apidoc/auth(M6a token 교환)</text>
  <text x="140" y="470" font-size="13" fill="#333">api.json / export / mock은 ?token= 필수, 누락/만료/오류는 401; auth 미사용 시 404, 데이터 라우트는 그대로 허용</text>

  <!-- 표시 계층 완료 -->
  <rect x="120" y="490" width="700" height="64" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="708" y="495" width="84" height="20" rx="10" fill="#27ae60"/>
  <text x="750" y="509" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4+M6</text>
  <text x="140" y="515" font-size="16" font-weight="bold" fill="#1e8449">표시 계층(완료) · 문서 UI 디버깅 패널(내장 Html, 외부 의존성 0)</text>
  <text x="140" y="537" font-size="13" fill="#333">목차 탐색 / 온라인 디버깅(CORS 직접 연결) / Mock 프리필</text>
  <text x="140" y="553" font-size="13" fill="#333">M6: 비밀번호 마스킹(프론트엔드 md5 제출로 token 교환) · 앱/버전 선택기 · token은 appKey별로 localStorage에 분리 저장</text>

  <!-- 데이터 흐름 -->
  <rect x="120" y="566" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <rect x="708" y="571" width="84" height="20" rx="10" fill="#b58900"/>
  <text x="750" y="585" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4+M6</text>
  <text x="140" y="588" font-size="13" fill="#333" font-family="monospace">브라우저 → /apidoc(디버깅 패널) → CORS 직접 연결 → 대상 인터페이스(실제 요청)</text>
  <text x="140" y="606" font-size="13" fill="#333" font-family="monospace">브라우저 → /apidoc/mock → Mock 데이터(fake crate · 15개 규칙)</text>
  <text x="140" y="622" font-size="13" fill="#333" font-family="monospace">브라우저 → /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; → token, 데이터 라우트는 ?token= 포함 접근</text>

  <!-- workspace -->
  <rect x="120" y="642" width="700" height="26" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2"/>
  <text x="470" y="660" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">workspace: apidoc(코어·auth.rs) · macros(매크로) · axum(어댑터) · actix(어댑터) · mock(Mock) · test-fixtures(테스트 픽스처)</text>

  <!-- 범례 -->
  <rect x="120" y="678" width="24" height="12" fill="#27ae60"/>
  <text x="152" y="689" font-size="13" fill="#333">구현됨(M1–M6)</text>
  <rect x="310" y="678" width="24" height="12" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="342" y="689" font-size="13" fill="#333">계획 중(v2: 코드 생성기 / 공유 링크 등)</text>
  <text x="700" y="689" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
