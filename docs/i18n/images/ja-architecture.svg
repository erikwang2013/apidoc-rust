<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="720" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="720" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust 全体アーキテクチャ（M6 完了）</text>

  <!-- ユーザーコード層 -->
  <rect x="120" y="62" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="140" y="88" font-size="17" font-weight="bold" fill="#5f4b00">ユーザーコード層</text>
  <text x="140" y="112" font-size="13" fill="#333" font-family="monospace">#[apidoc::title(...)]  #[apidoc::method("GET")]  #[apidoc::param(name="id", ty="int", required)] ...</text>

  <!-- コンパイル期 -->
  <rect x="120" y="138" width="700" height="72" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <rect x="724" y="144" width="96" height="22" rx="11" fill="#6c5ce7"/>
  <text x="772" y="159" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M1+M3+M6</text>
  <text x="140" y="164" font-size="17" font-weight="bold" fill="#3d2f9e">コンパイル期 · apidoc-macros（proc-macro）</text>
  <text x="140" y="188" font-size="12" fill="#333">20 個の属性マクロ：M1 基礎 7 個（title/desc/method/url/param/query/returned）＋M3 拡張 12 個（tag/group/author/header/route_param/response_status/success/error/not_debug/md/sort/ref）＋M6 app マウント</text>
  <text x="140" y="204" font-size="12" fill="#555">すべてコンパイル期のパラメータ検証つき（url は / 始まり、method はホワイトリスト、param name 必須）、不正な注釈は即コンパイルエラー</text>

  <!-- 登録 -->
  <rect x="250" y="222" width="440" height="46" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <rect x="610" y="227" width="62" height="20" rx="10" fill="#f39c12"/>
  <text x="641" y="241" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1</text>
  <text x="470" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d5200">linkme distributed_slice 静的登録</text>
  <text x="470" y="263" text-anchor="middle" font-size="12" fill="#555">コンパイル期に DocFragmentEntry 生成、実行時コストゼロで収集、crate 横断で自動集約</text>

  <!-- ランタイムコア -->
  <rect x="120" y="280" width="700" height="58" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <rect x="730" y="285" width="64" height="20" rx="10" fill="#2980b9"/>
  <text x="762" y="299" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1+M6</text>
  <text x="140" y="308" font-size="17" font-weight="bold" fill="#1a5276">ランタイムコア · apidoc（フレームワーク非依存）</text>
  <text x="140" y="330" font-size="13" fill="#333">DocRegistry::collect() で id マージ、seq で宣言順を復元 → ApiDoc データモデル</text>
  <text x="140" y="346" font-size="13" fill="#555" font-family="monospace">→ api.json（serde でシリアライズ、UI とエクスポートで共用；M6b は doc.apps ツリーを含む）→ エクスポート：md / ts / swagger（OpenAPI3）</text>

  <!-- 認証（M6a） -->
  <rect x="120" y="350" width="700" height="40" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <rect x="730" y="354" width="62" height="20" rx="10" fill="#c0392b"/>
  <text x="761" y="368" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M6a</text>
  <text x="140" y="368" font-size="13" fill="#333" font-family="monospace">auth.rs：GET /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; で token 取得（authcode 暗号化スイート、password/secret_key は決してシリアライズしない）</text>

  <!-- アダプタ層: 完了 -->
  <rect x="120" y="402" width="700" height="76" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="708" y="407" width="112" height="22" rx="11" fill="#27ae60"/>
  <text x="764" y="422" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M2+M4+M5+M6</text>
  <text x="140" y="428" font-size="16" font-weight="bold" fill="#1e8449">アダプタ層（完了）· apidoc-axum + apidoc-actix：ルートマウント + CORS</text>
  <!-- actix 完了 -->
  <rect x="656" y="434" width="148" height="24" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="2"/>
  <text x="730" y="450" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">apidoc-actix（完了）</text>
  <text x="140" y="452" font-size="13" fill="#333">/apidoc（UI）· /apidoc/api.json · /apidoc/mock · /apidoc/export · /apidoc/auth（M6a token 取得）</text>
  <text x="140" y="470" font-size="13" fill="#333">api.json / export / mock は ?token= 必須、欠落/期限切れ/誤りは 401；auth 未使用時は 404、データルートはそのまま許可</text>

  <!-- 表示層: 完了 -->
  <rect x="120" y="490" width="700" height="64" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="708" y="495" width="84" height="20" rx="10" fill="#27ae60"/>
  <text x="750" y="509" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4+M6</text>
  <text x="140" y="515" font-size="16" font-weight="bold" fill="#1e8449">表示層（完了）· ドキュメント UI デバッグパネル（内蔵 Html、外部依存ゼロ）</text>
  <text x="140" y="537" font-size="13" fill="#333">ディレクトリ閲覧 / オンラインデバッグ（CORS 直結）/ Mock 事前入力</text>
  <text x="140" y="553" font-size="13" fill="#333">M6：パスワードマスク（フロントエンドで md5 を送信し token 取得）· アプリ/バージョンセレクタ · token は appKey ごとに localStorage へ分けて保存</text>

  <!-- データフロー -->
  <rect x="120" y="566" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <rect x="708" y="571" width="84" height="20" rx="10" fill="#b58900"/>
  <text x="750" y="585" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4+M6</text>
  <text x="140" y="588" font-size="13" fill="#333" font-family="monospace">ブラウザ → /apidoc（デバッグパネル）→ CORS 直結 → 対象 API（実際のリクエスト）</text>
  <text x="140" y="606" font-size="13" fill="#333" font-family="monospace">ブラウザ → /apidoc/mock → Mock データ（fake crate · 15 ルール）</text>
  <text x="140" y="622" font-size="13" fill="#333" font-family="monospace">ブラウザ → /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; → token、データルートは ?token= 付きでアクセス</text>

  <!-- workspace -->
  <rect x="120" y="642" width="700" height="26" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2"/>
  <text x="470" y="660" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">workspace：apidoc（コア·auth.rs）· macros（マクロ）· axum（アダプタ）· actix（アダプタ）· mock（Mock）· test-fixtures（テストフィクスチャ）</text>

  <!-- 凡例 -->
  <rect x="120" y="678" width="24" height="12" fill="#27ae60"/>
  <text x="152" y="689" font-size="13" fill="#333">実装済み（M1–M6）</text>
  <rect x="310" y="678" width="24" height="12" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="342" y="689" font-size="13" fill="#333">計画中（v2：コード生成器 / 共有リンクなど）</text>
  <text x="700" y="689" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
