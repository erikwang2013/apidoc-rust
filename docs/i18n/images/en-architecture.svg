<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="600" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="600" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust Overall Architecture</text>

  <!-- User code layer -->
  <rect x="120" y="62" width="700" height="72" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="140" y="90" font-size="17" font-weight="bold" fill="#5f4b00">User Code Layer</text>
  <text x="140" y="114" font-size="13" fill="#333" font-family="monospace">#[apidoc::title(...)]  #[apidoc::method("GET")]  #[apidoc::param(name="id", ty="int", required)] ...</text>
  <text x="470" y="146" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Compile time -->
  <rect x="120" y="156" width="700" height="66" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <text x="140" y="184" font-size="17" font-weight="bold" fill="#3d2f9e">Compile Time · apidoc-macros (proc-macro)</text>
  <text x="140" y="207" font-size="13" fill="#333">7 attribute macros: title / desc / method / url / param / query / returned (with compile-time argument validation)</text>
  <text x="470" y="234" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Registration -->
  <rect x="250" y="244" width="440" height="52" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="470" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d5200">linkme distributed_slice Static Registration</text>
  <text x="470" y="287" text-anchor="middle" font-size="12" fill="#555">DocFragmentEntry generated at compile time, collected with zero runtime cost</text>
  <text x="470" y="308" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Runtime core -->
  <rect x="120" y="318" width="700" height="72" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <text x="140" y="346" font-size="17" font-weight="bold" fill="#1a5276">Runtime Core · apidoc (framework-agnostic)</text>
  <text x="140" y="370" font-size="13" fill="#333">DocRegistry::collect() merges fragments by id, restores declaration order by seq → ApiDoc data model</text>
  <text x="140" y="386" font-size="13" fill="#555" font-family="monospace">→ api.json (serde serialization, shared by UI and exports)</text>
  <text x="470" y="402" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Adapter layer (planned) -->
  <rect x="120" y="412" width="700" height="62" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="440" font-size="16" font-weight="bold" fill="#566573">Adapter Layer (planned) · thin wrappers, zero core changes</text>
  <text x="140" y="462" font-size="13" fill="#333">apidoc-axum / apidoc-actix: route mounting, CORS headers</text>
  <text x="470" y="486" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Presentation layer (planned) -->
  <rect x="120" y="496" width="700" height="66" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="524" font-size="16" font-weight="bold" fill="#566573">Presentation Layer (planned) · docs UI</text>
  <text x="140" y="547" font-size="13" fill="#333">Catalog browsing / online debugging (CORS direct) / Mock data / export Markdown · TypeScript · Swagger</text>

  <!-- Legend -->
  <rect x="120" y="572" width="24" height="12" fill="#2980b9"/>
  <text x="152" y="583" font-size="13" fill="#333">Implemented (M1)</text>
  <rect x="300" y="572" width="24" height="12" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="332" y="583" font-size="13" fill="#333">Planned</text>
  <text x="700" y="583" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
