<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 815" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="815" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="815" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">Возможности проекта apidoc-rust (M1–M6 завершено)</text>

  <!-- Карточка 1 -->
  <rect x="40" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Реализовано M1</text>
  <text x="60" y="106" font-size="17" font-weight="bold" fill="#1e8449">Аннотации как документация</text>
  <text x="60" y="130" font-size="13" fill="#333">7 базовых (M1): title / desc / method / url / param / query / returned</text>
  <text x="60" y="150" font-size="13" fill="#333">12 расширенных (M3): tag / group / author / header / route_param /</text>
  <text x="60" y="170" font-size="12" fill="#333">response_status / success / error / not_debug / md / sort / ref</text>
  <text x="60" y="190" font-size="13" fill="#333">Вложенность: required / default / desc / mock / children</text>

  <!-- Карточка 2 -->
  <rect x="480" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Реализовано M1</text>
  <text x="500" y="106" font-size="17" font-weight="bold" fill="#1e8449">Проверка в компайл-тайме</text>
  <text x="500" y="130" font-size="13" fill="#333">url с /, method по белому списку, param name обязателен</text>
  <text x="500" y="150" font-size="13" fill="#333">Ошибка компиляции с точным span — документ всегда актуален</text>
  <text x="500" y="190" font-size="13" fill="#333">12 расширенных аннотаций (M3) проверяются полностью</text>

  <!-- Карточка 3 -->
  <rect x="40" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Реализовано M1</text>
  <text x="60" y="256" font-size="17" font-weight="bold" fill="#1e8449">Автоматический сбор</text>
  <text x="60" y="280" font-size="13" fill="#333">linkme distributed_slice: статическая регистрация, без списков</text>
  <text x="60" y="300" font-size="13" fill="#333">DocRegistry::collect(): объединение по id, порядок по seq</text>
  <text x="60" y="320" font-size="13" fill="#333">Автосбор между crates: «весь API — из кода»</text>

  <!-- Карточка 4 -->
  <rect x="480" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Реализовано M2</text>
  <text x="500" y="256" font-size="17" font-weight="bold" fill="#1e8449">Адаптеры axum / actix + UI документации</text>
  <text x="500" y="280" font-size="13" fill="#333">apidoc-axum: /apidoc (UI) · /apidoc/api.json · /apidoc/mock</text>
  <text x="500" y="300" font-size="13" fill="#333">apidoc-actix: тонкая обёртка, 4 роута включая /apidoc/export (M5)</text>
  <text x="500" y="320" font-size="13" fill="#333">Встроенная UI-панель отладки (статический Html, без внешних зависимостей)</text>

  <!-- Карточка 5 -->
  <rect x="40" y="370" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="360" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Реализовано M4</text>
  <text x="60" y="406" font-size="17" font-weight="bold" fill="#1e8449">Онлайн-отладка + движок Mock</text>
  <text x="60" y="430" font-size="13" fill="#333">Панель: предзаполнение mock + прямое подключение через CORS</text>
  <text x="60" y="450" font-size="13" fill="#333">Движок crates/apidoc-mock: данные через crate fake</text>
  <text x="60" y="470" font-size="13" fill="#333">15 правил: имя/почта/телефон/IP/URL/UUID/дата/число/float/bool/текст…</text>

  <!-- Карточка 6 -->
  <rect x="480" y="370" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="360" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Реализовано M5</text>
  <text x="500" y="406" font-size="17" font-weight="bold" fill="#1e8449">Экспорт в три формата (M5)</text>
  <text x="500" y="430" font-size="13" fill="#333">Markdown / TypeScript / Swagger (OpenAPI 3.0)</text>
  <text x="500" y="450" font-size="13" fill="#333">info.version берётся из VERSION (предсериализация при сборке)</text>
  <text x="500" y="470" font-size="13" fill="#333">UI / api.json / экспорт используют одну модель данных</text>

  <!-- Карточка 7: M6a парольная аутентификация -->
  <rect x="40" y="520" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="510" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Реализовано M6a</text>
  <text x="60" y="556" font-size="17" font-weight="bold" fill="#1e8449">Парольная аутентификация</text>
  <text x="60" y="580" font-size="13" fill="#333">GET /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; обмен на token</text>
  <text x="60" y="600" font-size="13" fill="#333">api.json / export / mock требуют ?token=; отсутствует/истёк/ошибка — 401</text>
  <text x="60" y="620" font-size="13" fill="#333">Крипто-набор authcode (вариант RC4 + контрольная сумма md5, MAC за постоянное время)</text>
  <text x="60" y="640" font-size="13" fill="#333">password / secret_key никогда не сериализуются · пароль приложения приоритетнее глобального</text>

  <!-- Карточка 8: M6b несколько приложений и версий -->
  <rect x="480" y="520" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="510" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Реализовано M6b</text>
  <text x="500" y="556" font-size="17" font-weight="bold" fill="#1e8449">Несколько приложений и версий</text>
  <text x="500" y="580" font-size="13" fill="#333">#[apidoc::app("key")] монтирует эндпоинты · дерево конфигурации ApidocConfig.apps</text>
  <text x="500" y="600" font-size="13" fill="#333">api.json выдаёт дерево doc.apps (key / title / items рекурсивно)</text>
  <text x="500" y="620" font-size="13" fill="#333">Селектор приложения/версии вверху UI · token хранится по appKey в localStorage</text>
  <text x="500" y="640" font-size="13" fill="#333">Эндпоинты без app попадают в приложение по умолчанию · без настройки идентично M5 побайтово</text>

  <!-- Карточка 9: план v2 -->
  <rect x="40" y="670" width="860" height="120" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="740" y="660" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="815" y="676" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">В планах</text>
  <text x="60" y="706" font-size="17" font-weight="bold" fill="#566573">План v2</text>
  <text x="60" y="730" font-size="13" fill="#333">Кодогенератор · ссылки на поля таблиц · ссылки для обмена · события отладки</text>
  <text x="60" y="750" font-size="13" fill="#333">Адаптеры: axum / actix покрыты (возможности 1:1)</text>
  <text x="60" y="770" font-size="13" fill="#333">M1–M6 полностью реализованы (включая парольную аутентификацию · несколько приложений и версий)</text>

  <text x="470" y="805" text-anchor="middle" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
