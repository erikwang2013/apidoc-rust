<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="940" height="480" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="480" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">Ciclo de vida da documentação do apidoc-rust (M1–M6 concluído)</text>

  <!-- Etapa 1 -->
  <circle cx="85" cy="150" r="34" fill="#b58900"/>
  <text x="85" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">1</text>
  <text x="85" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Escrever anotações</text>
  <text x="85" y="235" text-anchor="middle" font-size="12" fill="#555">anexadas ao handler</text>
  <text x="85" y="252" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">#[apidoc::*]</text>
  <text x="85" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1</text>

  <line x1="125" y1="150" x2="160" y2="150" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 2 -->
  <circle cx="200" cy="150" r="34" fill="#6c5ce7"/>
  <text x="200" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">2</text>
  <text x="200" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Expansão de macros</text>
  <text x="200" y="235" text-anchor="middle" font-size="12" fill="#555">gerado em tempo de compilação</text>
  <text x="200" y="252" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">DocFragmentEntry</text>
  <text x="200" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1</text>

  <line x1="240" y1="150" x2="275" y2="150" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 3 -->
  <circle cx="315" cy="150" r="34" fill="#f39c12"/>
  <text x="315" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">3</text>
  <text x="315" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Registro linkme</text>
  <text x="315" y="235" text-anchor="middle" font-size="12" fill="#555">fatia distribuída estática</text>
  <text x="315" y="252" text-anchor="middle" font-size="12" fill="#555">custo zero em tempo de execução</text>
  <text x="315" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1</text>

  <line x1="355" y1="150" x2="390" y2="150" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 4 -->
  <circle cx="430" cy="150" r="34" fill="#2980b9"/>
  <text x="430" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">4</text>
  <text x="430" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Agregação collect()</text>
  <text x="430" y="235" text-anchor="middle" font-size="12" fill="#555">mescla fragmentos por id</text>
  <text x="430" y="252" text-anchor="middle" font-size="12" fill="#555">restaura a ordem de declaração por seq</text>
  <text x="430" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1</text>

  <line x1="470" y1="150" x2="505" y2="150" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 5 -->
  <circle cx="545" cy="150" r="34" fill="#27ae60"/>
  <text x="545" y="158" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">5</text>
  <text x="545" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">api.json</text>
  <text x="545" y="235" text-anchor="middle" font-size="12" fill="#555">modelo de dados unificado da documentação</text>
  <text x="545" y="252" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">config + endpoints + apps</text>
  <text x="545" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M1·M6</text>

  <!-- Seta de virada 5 → 6 -->
  <line x1="579" y1="150" x2="856" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 6: M6a autenticação e troca por token -->
  <circle cx="890" cy="310" r="34" fill="#c0392b"/>
  <text x="890" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">6</text>
  <text x="890" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Autenticação e troca por token</text>
  <text x="890" y="395" text-anchor="middle" font-size="12" fill="#555">md5 enviado pelo frontend</text>
  <text x="890" y="412" text-anchor="middle" font-size="12" fill="#555">rotas de dados exigem ?token= (401)</text>
  <text x="890" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M6a</text>

  <line x1="850" y1="310" x2="815" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 7: M6b renderização por aplicativo -->
  <circle cx="775" cy="310" r="34" fill="#34495e"/>
  <text x="775" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">7</text>
  <text x="775" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Renderização por aplicativo</text>
  <text x="775" y="395" text-anchor="middle" font-size="12" fill="#555">seletor de aplicativo/versão na UI</text>
  <text x="775" y="412" text-anchor="middle" font-size="12" fill="#555">token armazenado por appKey</text>
  <text x="775" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M6b</text>

  <line x1="735" y1="310" x2="700" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 8, implementado -->
  <circle cx="660" cy="310" r="34" fill="#16a085"/>
  <text x="660" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">8</text>
  <text x="660" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Painel de depuração da UI</text>
  <text x="660" y="395" text-anchor="middle" font-size="12" fill="#555">navegação / depuração on-line</text>
  <text x="660" y="412" text-anchor="middle" font-size="12" fill="#555">pré-preenchimento Mock / CORS direto</text>
  <text x="660" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M2·M4</text>

  <line x1="620" y1="310" x2="585" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 9, implementado -->
  <circle cx="545" cy="310" r="34" fill="#e67e22"/>
  <text x="545" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">9</text>
  <text x="545" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Fluxo de depuração</text>
  <text x="545" y="395" text-anchor="middle" font-size="12" fill="#555">CORS direto ao endpoint de destino</text>
  <text x="545" y="412" text-anchor="middle" font-size="12" fill="#555">/apidoc/mock → mock</text>
  <text x="545" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M4</text>

  <line x1="505" y1="310" x2="470" y2="310" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etapa 10, implementado -->
  <circle cx="430" cy="310" r="34" fill="#8e44ad"/>
  <text x="430" y="318" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">10</text>
  <text x="430" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Exportação em três formatos</text>
  <text x="430" y="395" text-anchor="middle" font-size="12" fill="#555">md / ts / swagger</text>
  <text x="430" y="412" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">OpenAPI 3.0</text>
  <text x="430" y="432" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">M5</text>

  <!-- Legenda -->
  <text x="470" y="455" text-anchor="middle" font-size="13" fill="#333">Etapas: M1 anotações / coleta / agregação / saída · M2 adaptador e UI · M4 painel de depuração / Mock / CORS direto · M5 exportação em três formatos · M6a autenticação por senha · M6b múltiplos aplicativos e versões (tudo implementado, nada planejado)</text>
  <text x="700" y="472" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
