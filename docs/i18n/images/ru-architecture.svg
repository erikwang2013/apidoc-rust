<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="600" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="600" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">Общая архитектура apidoc-rust</text>

  <!-- Слой пользовательского кода -->
  <rect x="120" y="62" width="700" height="72" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="140" y="90" font-size="17" font-weight="bold" fill="#5f4b00">Слой пользовательского кода</text>
  <text x="140" y="114" font-size="13" fill="#333" font-family="monospace">#[apidoc::title(...)]  #[apidoc::method("GET")]  #[apidoc::param(name="id", ty="int", required)] ...</text>
  <text x="470" y="146" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Этап компиляции -->
  <rect x="120" y="156" width="700" height="66" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <text x="140" y="184" font-size="17" font-weight="bold" fill="#3d2f9e">Этап компиляции · apidoc-macros (proc-macro)</text>
  <text x="140" y="207" font-size="13" fill="#333">7 атрибутных макросов: title / desc / method / url / param / query / returned (с проверкой параметров)</text>
  <text x="470" y="234" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Регистрация -->
  <rect x="250" y="244" width="440" height="52" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="470" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d5200">Статическая регистрация linkme distributed_slice</text>
  <text x="470" y="287" text-anchor="middle" font-size="12" fill="#555">DocFragmentEntry в компайл-тайме, сбор без затрат в рантайме</text>
  <text x="470" y="308" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Ядро рантайма -->
  <rect x="120" y="318" width="700" height="72" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <text x="140" y="346" font-size="17" font-weight="bold" fill="#1a5276">Ядро рантайма · apidoc (не зависит от фреймворка)</text>
  <text x="140" y="370" font-size="13" fill="#333">DocRegistry::collect() объединяет фрагменты по id, порядок по seq → модель данных ApiDoc</text>
  <text x="140" y="386" font-size="13" fill="#555" font-family="monospace">→ api.json (serde-сериализация, общий источник для UI и экспорта)</text>
  <text x="470" y="402" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Слой адаптеров, в планах -->
  <rect x="120" y="412" width="700" height="62" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="440" font-size="16" font-weight="bold" fill="#566573">Слой адаптеров (в планах) · тонкая обёртка, ядро не меняется</text>
  <text x="140" y="462" font-size="13" fill="#333">apidoc-axum / apidoc-actix: монтирование маршрутов, CORS-заголовки</text>
  <text x="470" y="486" text-anchor="middle" font-size="16" fill="#555">▼</text>

  <!-- Слой отображения, в планах -->
  <rect x="120" y="496" width="700" height="66" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="524" font-size="16" font-weight="bold" fill="#566573">Слой отображения (в планах) · UI документации</text>
  <text x="140" y="547" font-size="13" fill="#333">Разделы / онлайн-отладка (CORS) / Mock-данные / экспорт Markdown · TypeScript · Swagger</text>

  <!-- Легенда -->
  <rect x="120" y="572" width="24" height="12" fill="#2980b9"/>
  <text x="152" y="583" font-size="13" fill="#333">Реализовано (M1)</text>
  <rect x="300" y="572" width="24" height="12" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="332" y="583" font-size="13" fill="#333">В планах</text>
  <text x="700" y="583" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
