<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="720" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="720" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust সামগ্রিক আর্কিটেকচার (M6 সম্পন্ন)</text>

  <!-- ইউজার কোড লেয়ার -->
  <rect x="120" y="62" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="140" y="88" font-size="17" font-weight="bold" fill="#5f4b00">ইউজার কোড লেয়ার</text>
  <text x="140" y="112" font-size="13" fill="#333" font-family="monospace">#[apidoc::title(...)]  #[apidoc::method("GET")]  #[apidoc::param(name="id", ty="int", required)] ...</text>

  <!-- কম্পাইল-টাইম -->
  <rect x="120" y="138" width="700" height="72" rx="8" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <rect x="724" y="144" width="96" height="22" rx="11" fill="#6c5ce7"/>
  <text x="772" y="159" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M1+M3+M6</text>
  <text x="140" y="164" font-size="17" font-weight="bold" fill="#3d2f9e">কম্পাইল-টাইম · apidoc-macros (proc-macro)</text>
  <text x="140" y="188" font-size="12" fill="#333">২০টি অ্যাট্রিবিউট ম্যাক্রো: M1-এর ৭টি মৌলিক (title/desc/method/url/param/query/returned) + M3-এর ১২টি এক্সটেনশন (tag/group/author/header/route_param/response_status/success/error/not_debug/md/sort/ref) + M6 অ্যাপ মাউন্টিং</text>
  <text x="140" y="204" font-size="12" fill="#555">সবগুলোতে কম্পাইল-টাইম প্যারামিটার ভ্যালিডেশন (url / দিয়ে শুরু, method হোয়াইটলিস্ট, param name বাধ্যতামূলক), অবৈধ অ্যানোটেশন সরাসরি কম্পাইল এরর</text>

  <!-- রেজিস্ট্রেশন -->
  <rect x="250" y="222" width="440" height="46" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <rect x="610" y="227" width="62" height="20" rx="10" fill="#f39c12"/>
  <text x="641" y="241" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1</text>
  <text x="470" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d5200">linkme distributed_slice স্ট্যাটিক রেজিস্ট্রেশন</text>
  <text x="470" y="263" text-anchor="middle" font-size="12" fill="#555">কম্পাইল-টাইমে DocFragmentEntry জেনারেশন, শূন্য রানটাইম খরচে সংগ্রহ, ক্রস-crate স্বয়ংক্রিয় সমষ্টিকরণ</text>

  <!-- রানটাইম কোর -->
  <rect x="120" y="280" width="700" height="58" rx="8" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
  <rect x="730" y="285" width="64" height="20" rx="10" fill="#2980b9"/>
  <text x="762" y="299" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M1+M6</text>
  <text x="140" y="308" font-size="17" font-weight="bold" fill="#1a5276">রানটাইম কোর · apidoc (ফ্রেমওয়ার্ক-নিরপেক্ষ)</text>
  <text x="140" y="330" font-size="13" fill="#333">DocRegistry::collect() id অনুযায়ী ফ্র্যাগমেন্ট মার্জ করে, seq অনুযায়ী ডিক্লারেশন ক্রম পুনরুদ্ধার করে → ApiDoc ডেটা মডেল</text>
  <text x="140" y="346" font-size="13" fill="#555" font-family="monospace">→ api.json (serde সিরিয়ালাইজেশন, UI ও এক্সপোর্টে ভাগাভাগি; M6b-তে doc.apps ট্রি) → এক্সপোর্ট: md / ts / swagger (OpenAPI3)</text>

  <!-- অথেনটিকেশন (M6a) -->
  <rect x="120" y="350" width="700" height="40" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <rect x="730" y="354" width="62" height="20" rx="10" fill="#c0392b"/>
  <text x="761" y="368" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M6a</text>
  <text x="140" y="368" font-size="13" fill="#333" font-family="monospace">auth.rs: GET /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; দিয়ে token নিন (authcode এনক্রিপশন; password/secret_key কখনো সিরিয়ালাইজ হয় না)</text>

  <!-- অ্যাডাপ্টার লেয়ার: সম্পন্ন -->
  <rect x="120" y="402" width="700" height="76" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="708" y="407" width="112" height="22" rx="11" fill="#27ae60"/>
  <text x="764" y="422" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">M2+M4+M5+M6</text>
  <text x="140" y="428" font-size="16" font-weight="bold" fill="#1e8449">অ্যাডাপ্টার লেয়ার (সম্পন্ন) · apidoc-axum + apidoc-actix: রাউট মাউন্টিং + CORS</text>
  <!-- actix সম্পন্ন -->
  <rect x="656" y="434" width="148" height="24" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="2"/>
  <text x="730" y="450" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">apidoc-actix (সম্পন্ন)</text>
  <text x="140" y="452" font-size="13" fill="#333">/apidoc (UI) · /apidoc/api.json · /apidoc/mock · /apidoc/export · /apidoc/auth (M6a token নেওয়া)</text>
  <text x="140" y="470" font-size="13" fill="#333">api.json / export / mock-এর জন্য ?token= আবশ্যক; অনুপস্থিত/মেয়াদোত্তীর্ণ/ভুল → 401; auth নিষ্ক্রিয় থাকলে 404, ডেটা রুট সরাসরি চলে</text>

  <!-- প্রেজেন্টেশন লেয়ার: সম্পন্ন -->
  <rect x="120" y="490" width="700" height="64" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="708" y="495" width="84" height="20" rx="10" fill="#27ae60"/>
  <text x="750" y="509" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4+M6</text>
  <text x="140" y="515" font-size="16" font-weight="bold" fill="#1e8449">প্রেজেন্টেশন লেয়ার (সম্পন্ন) · ডকুমেন্ট UI ডিবাগ প্যানেল (এমবেডেড Html, বাহ্যিক নির্ভরতা শূন্য)</text>
  <text x="140" y="537" font-size="13" fill="#333">ডিরেক্টরি ব্রাউজিং / অনলাইন ডিবাগিং (CORS ডাইরেক্ট) / Mock প্রি-ফিল</text>
  <text x="140" y="553" font-size="13" fill="#333">M6: পাসওয়ার্ড মাস্ক (ফ্রন্টএন্ড md5 জমা দেয়) · অ্যাপ/ভার্সন সিলেক্টর · token প্রতি appKey-তে localStorage-এ সংরক্ষণ</text>

  <!-- ডেটা ফ্লো -->
  <rect x="120" y="566" width="700" height="64" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <rect x="708" y="571" width="84" height="20" rx="10" fill="#b58900"/>
  <text x="750" y="585" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M4+M6</text>
  <text x="140" y="588" font-size="13" fill="#333" font-family="monospace">ব্রাউজার → /apidoc (ডিবাগ প্যানেল) → CORS ডাইরেক্ট → টার্গেট ইন্টারফেস (বাস্তব রিকোয়েস্ট)</text>
  <text x="140" y="606" font-size="13" fill="#333" font-family="monospace">ব্রাউজার → /apidoc/mock → Mock ডেটা (fake crate · ১৫টি রুল)</text>
  <text x="140" y="622" font-size="13" fill="#333" font-family="monospace">ব্রাউজার → /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; → token, তারপর ?token= দিয়ে ডেটা রুটে যান</text>

  <!-- workspace -->
  <rect x="120" y="642" width="700" height="26" rx="8" fill="#fdfefe" stroke="#95a5a6" stroke-width="2"/>
  <text x="470" y="660" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">workspace: apidoc (কোর·auth.rs) · macros (ম্যাক্রো) · axum (অ্যাডাপ্টার) · actix (অ্যাডাপ্টার) · mock (Mock) · test-fixtures (টেস্ট ফিক্সচার)</text>

  <!-- লেজেন্ড -->
  <rect x="120" y="678" width="24" height="12" fill="#27ae60"/>
  <text x="152" y="689" font-size="13" fill="#333">বাস্তবায়িত (M1–M6)</text>
  <rect x="310" y="678" width="24" height="12" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="342" y="689" font-size="13" fill="#333">পরিকল্পনাধীন (v2: কোড জেনারেটর / শেয়ার লিংক ইত্যাদি)</text>
  <text x="700" y="689" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
