<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 815" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="815" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="815" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust Project Features (M1–M6 Complete)</text>

  <!-- Card 1 -->
  <rect x="40" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M1</text>
  <text x="60" y="106" font-size="17" font-weight="bold" fill="#1e8449">Annotation-based Documentation</text>
  <text x="60" y="130" font-size="13" fill="#333">M1 seven macros: title / desc / method / url / param / query / returned</text>
  <text x="60" y="150" font-size="13" fill="#333">M3 adds 12: tag / group / author / header / route_param /</text>
  <text x="60" y="170" font-size="12" fill="#333">response_status / success / error / not_debug / md / sort / ref</text>
  <text x="60" y="190" font-size="13" fill="#333">Params support nested required / default / desc / mock / children</text>

  <!-- Card 2 -->
  <rect x="480" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M1</text>
  <text x="500" y="106" font-size="17" font-weight="bold" fill="#1e8449">Compile-time Validation</text>
  <text x="500" y="130" font-size="13" fill="#333">url must start with /, method whitelist, param name required</text>
  <text x="500" y="150" font-size="13" fill="#333">Invalid annotations fail at compile time (precise span); docs never drift from code</text>
  <text x="500" y="190" font-size="13" fill="#333">The 12 extended annotations (M3) are fully validated too</text>

  <!-- Card 3 -->
  <rect x="40" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M1</text>
  <text x="60" y="256" font-size="17" font-weight="bold" fill="#1e8449">Automatic Collection</text>
  <text x="60" y="280" font-size="13" fill="#333">linkme distributed_slice static registration, no manual endpoint list</text>
  <text x="60" y="300" font-size="13" fill="#333">DocRegistry::collect() merges by id, restores declaration order by seq</text>
  <text x="60" y="320" font-size="13" fill="#333">Cross-crate collection: scanning code yields every endpoint</text>

  <!-- Card 4 -->
  <rect x="480" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M2</text>
  <text x="500" y="256" font-size="17" font-weight="bold" fill="#1e8449">axum / actix Adapters + Docs UI</text>
  <text x="500" y="280" font-size="13" fill="#333">apidoc-axum: /apidoc (UI) · /apidoc/api.json · /apidoc/mock</text>
  <text x="500" y="300" font-size="13" fill="#333">apidoc-actix: thin wrapper, 4 routes incl. /apidoc/export (M5)</text>
  <text x="500" y="320" font-size="13" fill="#333">Embedded docs UI debug panel (static Html, zero external deps)</text>

  <!-- Card 5 -->
  <rect x="40" y="370" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="360" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M4</text>
  <text x="60" y="406" font-size="17" font-weight="bold" fill="#1e8449">Online Debugging + Mock Engine</text>
  <text x="60" y="430" font-size="13" fill="#333">Debug panel: mock prefill + browser CORS direct to target endpoint</text>
  <text x="60" y="450" font-size="13" fill="#333">crates/apidoc-mock engine: depends on the fake crate for data</text>
  <text x="60" y="470" font-size="13" fill="#333">15 rules: name/email/phone/IP/URL/UUID/date/number/float/bool/text…</text>

  <!-- Card 6 -->
  <rect x="480" y="370" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="360" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M5</text>
  <text x="500" y="406" font-size="17" font-weight="bold" fill="#1e8449">Three-format Export (M5)</text>
  <text x="500" y="430" font-size="13" fill="#333">Markdown / TypeScript / Swagger (OpenAPI 3.0)</text>
  <text x="500" y="450" font-size="13" fill="#333">info.version taken from the VERSION file (build-time pre-serialization)</text>
  <text x="500" y="470" font-size="13" fill="#333">UI / api.json / export share the same data model</text>

  <!-- Card 7: M6a password auth -->
  <rect x="40" y="520" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="510" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M6a</text>
  <text x="60" y="556" font-size="17" font-weight="bold" fill="#1e8449">Password Auth</text>
  <text x="60" y="580" font-size="13" fill="#333">GET /apidoc/auth?password=&lt;md5&gt;&amp;appKey=&lt;key&gt; exchanges for a token</text>
  <text x="60" y="600" font-size="13" fill="#333">api.json / export / mock require ?token=; missing/expired/invalid returns 401</text>
  <text x="60" y="620" font-size="13" fill="#333">authcode sealed envelope (RC4 variant + md5 checksum, constant-time MAC)</text>
  <text x="60" y="640" font-size="13" fill="#333">password / secret_key are never serialized · app password overrides global</text>

  <!-- Card 8: M6b multi-app multi-version -->
  <rect x="480" y="520" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="510" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M6b</text>
  <text x="500" y="556" font-size="17" font-weight="bold" fill="#1e8449">Multi-app Multi-version</text>
  <text x="500" y="580" font-size="13" fill="#333">#[apidoc::app("key")] mounts endpoints · ApidocConfig.apps config tree</text>
  <text x="500" y="600" font-size="13" fill="#333">api.json outputs the doc.apps tree (key / title / items recursive)</text>
  <text x="500" y="620" font-size="13" fill="#333">UI top app/version selector · tokens stored per appKey in localStorage</text>
  <text x="500" y="640" font-size="13" fill="#333">Unmounted endpoints fall into the default app · byte-identical to M5 when unconfigured</text>

  <!-- Card 9: v2 planning -->
  <rect x="40" y="670" width="860" height="120" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="740" y="660" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="815" y="676" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Planned</text>
  <text x="60" y="706" font-size="17" font-weight="bold" fill="#566573">v2 Planning</text>
  <text x="60" y="730" font-size="13" fill="#333">Code generator · data table field references · share links · debug events</text>
  <text x="60" y="750" font-size="13" fill="#333">Adapters: axum / actix both covered (1:1 features)</text>
  <text x="60" y="770" font-size="13" fill="#333">M1–M6 all complete (incl. password auth · multi-app multi-version)</text>

  <text x="470" y="805" text-anchor="middle" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
