<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="560" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="560" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust Project Features</text>

  <!-- Card 1 -->
  <rect x="40" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M1</text>
  <text x="60" y="106" font-size="17" font-weight="bold" fill="#1e8449">Annotation-based Documentation</text>
  <text x="60" y="130" font-size="13" fill="#333">title / desc / method / url / param / query / returned</text>
  <text x="60" y="150" font-size="13" fill="#333">Seven macros annotate one by one, mirroring PHP attributes</text>
  <text x="60" y="170" font-size="13" fill="#333">Params support nested required / default / desc / mock / children</text>

  <!-- Card 2 -->
  <rect x="480" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M1</text>
  <text x="500" y="106" font-size="17" font-weight="bold" fill="#1e8449">Compile-time Validation</text>
  <text x="500" y="130" font-size="13" fill="#333">url must start with /, method whitelist, param name required</text>
  <text x="500" y="150" font-size="13" fill="#333">Compile-time errors with precise spans; docs never drift</text>

  <!-- Card 3 -->
  <rect x="40" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M1</text>
  <text x="60" y="256" font-size="17" font-weight="bold" fill="#1e8449">Automatic Collection</text>
  <text x="60" y="280" font-size="13" fill="#333">linkme distributed_slice static registration, no manual endpoint list</text>
  <text x="60" y="300" font-size="13" fill="#333">DocRegistry::collect() merges by id, restores order by seq</text>
  <text x="60" y="320" font-size="13" fill="#333">Cross-crate collection: scanning code yields every endpoint</text>

  <!-- Card 4 -->
  <rect x="480" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Implemented M1</text>
  <text x="500" y="256" font-size="17" font-weight="bold" fill="#1e8449">api.json Output</text>
  <text x="500" y="280" font-size="13" fill="#333">serde serializes the unified data model (config + endpoints)</text>
  <text x="500" y="300" font-size="13" fill="#333">PHP-aligned fields: title/desc/url/method/params/querys/returned</text>
  <text x="500" y="320" font-size="13" fill="#333">UI display and export share one data source</text>

  <!-- Card 5 -->
  <rect x="40" y="370" width="420" height="130" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="300" y="360" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="375" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Planned</text>
  <text x="60" y="406" font-size="17" font-weight="bold" fill="#566573">Online Debugging + Mock</text>
  <text x="60" y="430" font-size="13" fill="#333">Browser CORS direct connection to endpoints, no server proxy</text>
  <text x="60" y="450" font-size="13" fill="#333">Mock rules (@integer(1,100), etc.) map to the fake crate for data</text>
  <text x="60" y="470" font-size="13" fill="#333">Multi-app / multi-version / access password</text>

  <!-- Card 6 -->
  <rect x="480" y="370" width="420" height="130" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="740" y="360" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="815" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Planned</text>
  <text x="500" y="406" font-size="17" font-weight="bold" fill="#566573">Multi-framework Adapters + Export</text>
  <text x="500" y="430" font-size="13" fill="#333">apidoc-axum / apidoc-actix thin adapters, zero core changes</text>
  <text x="500" y="450" font-size="13" fill="#333">Export Markdown / TypeScript / Swagger (OpenAPI3)</text>
  <text x="500" y="470" font-size="13" fill="#333">Doc caching / debug events (v2: code generator, share links)</text>

  <text x="470" y="530" text-anchor="middle" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
