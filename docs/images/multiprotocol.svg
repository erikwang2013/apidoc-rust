<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 820" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="940" height="820" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="820" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#222">apidoc-rust 多协议调试架构（P0–P6）</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#555">注解生成文档与调试面板 · 浏览器直连 + 服务端代发 · 默认构建零重型依赖</text>

  <!-- 1. 注解层 -->
  <rect x="40" y="78" width="860" height="92" rx="10" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="58" y="104" font-size="16" font-weight="bold" fill="#5f4b00">1 · 注解层（编译期）</text>
  <text x="58" y="126" font-size="12.5" font-family="monospace" fill="#333">#[apidoc::grpc(...)]  #[apidoc::websocket("wss://…")]  #[apidoc::mqtt(..., topic="sensors/#")]</text>
  <text x="58" y="146" font-size="12.5" font-family="monospace" fill="#333">#[apidoc::event(direction="in", name="message")]  #[apidoc::param(..., field="1")]</text>
  <text x="58" y="164" font-size="12" fill="#7a5b00">45 个协议别名 + 通用 protocol(kind) · kind / 参数 / 字段号编译期校验</text>

  <!-- 2. 文档与 UI -->
  <rect x="40" y="186" width="860" height="98" rx="10" fill="#e8e4f8" stroke="#6c5ce7" stroke-width="2"/>
  <text x="58" y="212" font-size="16" font-weight="bold" fill="#3d2f8f">2 · 文档模型与 UI</text>
  <text x="58" y="236" font-size="12.5" font-family="monospace" fill="#333">DocEndpoint { protocol, protocol_opts, events, params.field }</text>
  <text x="58" y="256" font-size="12.5" fill="#333">api.json · 协议徽标/连接参数/事件表 · 协议调试面板 · md / ts / swagger / asyncapi 导出</text>
  <text x="58" y="274" font-size="12" fill="#4a3d99">构建期物化：请求期只查表 + Bytes 克隆，本地 p99 &lt; 10ms</text>

  <!-- 3a. 浏览器直连 -->
  <rect x="40" y="300" width="420" height="218" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="58" y="326" font-size="16" font-weight="bold" fill="#1e8449">3a · 浏览器直连（无需 Rust 依赖）</text>
  <text x="58" y="352" font-size="12" fill="#333">SOAP · GraphQL（含订阅） · JSON-RPC · XML-RPC</text>
  <text x="58" y="372" font-size="12" fill="#333">OData · MCP · A2A · Webhooks</text>
  <text x="58" y="398" font-size="12" fill="#333">WebSocket（文本/二进制帧） · SSE · Socket.IO</text>
  <text x="58" y="418" font-size="12" fill="#333">STOMP（含二进制） · GraphQL-WS</text>
  <text x="58" y="444" font-size="12" fill="#333">WebRTC / DataChannel · HLS 预览</text>
  <text x="58" y="476" font-size="12" fill="#1e8449">认证：URL query；调试脚本：前置/后置</text>
  <text x="58" y="496" font-size="12" fill="#1e8449">直接请求目标，CORS 由适配器放行</text>

  <!-- 3b. 服务端执行器 -->
  <rect x="480" y="300" width="420" height="218" rx="10" fill="#eaf1fe" stroke="#2563eb" stroke-width="2"/>
  <text x="498" y="326" font-size="16" font-weight="bold" fill="#1d4ed8">3b · 服务端执行器（feature-gated）</text>
  <text x="498" y="352" font-size="12" fill="#333">HTTP/2 · HTTP/3 · gRPC（一元/服务端流）</text>
  <text x="498" y="372" font-size="12" fill="#333">Thrift · Dubbo/Hessian · ISO 8583</text>
  <text x="498" y="392" font-size="12" fill="#333">TCP / UDP / Raw / Unix Domain Socket</text>
  <text x="498" y="412" font-size="12" fill="#333">MQTT · AMQP · Kafka · XMPP · STOMP/TCP</text>
  <text x="498" y="432" font-size="12" fill="#333">CoAP · LwM2M · Modbus · DNP3 · IEC 104</text>
  <text x="498" y="452" font-size="12" fill="#333">BACnet/IP · OPC UA · RTP/RTCP · RTSP · SIP · RTMP</text>
  <text x="498" y="478" font-size="12" fill="#1d4ed8">POST /apidoc/debug（一元）</text>
  <text x="498" y="498" font-size="12" fill="#1d4ed8">GET /apidoc/debug/stream（WS 会话桥）</text>

  <!-- 4. 安全与边界 -->
  <rect x="40" y="538" width="860" height="150" rx="10" fill="#fdeeee" stroke="#dc2626" stroke-width="2"/>
  <text x="58" y="564" font-size="16" font-weight="bold" fill="#991b1b">4 · 安全与运行边界</text>
  <text x="58" y="590" font-size="12.5" fill="#333">DebugConfig 默认关闭；开启需全局鉴权（AuthConfig enable + 非空 password），否则构建期 panic</text>
  <text x="58" y="610" font-size="12.5" fill="#333">SSRF 守卫：allow_hosts / 默认拒回环·私网·链路本地·CGNAT；云元数据永久拒绝</text>
  <text x="58" y="630" font-size="12.5" fill="#333">DNS 解析后逐 IP 校验并钉住连接；禁重定向、系统代理、CONNECT；Unix socket 默认关闭</text>
  <text x="58" y="650" font-size="12.5" fill="#333">max_bytes / max_frames / timeout 全链路封顶；凭据永不进 api.json、日志或错误文本</text>
  <text x="58" y="672" font-size="12.5" fill="#991b1b">TLS 钉扎未实现的协议（wss / gRPC https / MQTT TLS / AMQP TLS）当前 fail closed</text>

  <!-- 5. 默认构建 -->
  <rect x="40" y="706" width="860" height="58" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2"/>
  <text x="58" y="730" font-size="14" font-weight="bold" fill="#475569">5 · 依赖策略</text>
  <text x="58" y="752" font-size="12.5" fill="#333">默认构建不引入 axum/actix/reqwest/tonic/broker 等重型依赖；每个协议族一个 feature，debug-all 仅做聚合。</text>

  <text x="470" y="795" text-anchor="middle" font-size="12" fill="#888">watermark: https://erik.xyz</text>
</svg>
