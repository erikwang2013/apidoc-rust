<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="sans-serif">
  <defs>
    <pattern id="wm" width="340" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="8" y="44" font-size="30" fill="#888888" opacity="0.15">https://erik.xyz</text>
    </pattern>
  </defs>
  <rect width="940" height="560" fill="url(#wm)"/>
  <rect x="0" y="0" width="940" height="560" fill="none" stroke="#333" stroke-width="2"/>

  <text x="470" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">apidoc-rust 项目功能</text>

  <!-- 卡片 1 -->
  <rect x="40" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">已实现 M1</text>
  <text x="60" y="106" font-size="17" font-weight="bold" fill="#1e8449">注解式文档</text>
  <text x="60" y="130" font-size="13" fill="#333">title / desc / method / url / param / query / returned</text>
  <text x="60" y="150" font-size="13" fill="#333">七个属性宏逐条注解，对齐 PHP attributes 语义</text>
  <text x="60" y="170" font-size="13" fill="#333">参数支持 required / default / desc / mock / children 嵌套</text>

  <!-- 卡片 2 -->
  <rect x="480" y="70" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="60" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">已实现 M1</text>
  <text x="500" y="106" font-size="17" font-weight="bold" fill="#1e8449">编译期校验</text>
  <text x="500" y="130" font-size="13" fill="#333">url 必须以 / 开头、method 白名单、param name 必填</text>
  <text x="500" y="150" font-size="13" fill="#333">非法注解编译期报错（span 精确），文档与代码永不失同步</text>

  <!-- 卡片 3 -->
  <rect x="40" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="300" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="375" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">已实现 M1</text>
  <text x="60" y="256" font-size="17" font-weight="bold" fill="#1e8449">自动收集</text>
  <text x="60" y="280" font-size="13" fill="#333">linkme distributed_slice 静态注册，无需手动接口清单</text>
  <text x="60" y="300" font-size="13" fill="#333">DocRegistry::collect() 按 id 合并、按 seq 恢复声明顺序</text>
  <text x="60" y="320" font-size="13" fill="#333">跨 crate 自动收集，等价"扫描代码即得全部接口"</text>

  <!-- 卡片 4 -->
  <rect x="480" y="220" width="420" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="740" y="210" width="150" height="24" rx="12" fill="#27ae60"/>
  <text x="815" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">已实现 M1</text>
  <text x="500" y="256" font-size="17" font-weight="bold" fill="#1e8449">api.json 输出</text>
  <text x="500" y="280" font-size="13" fill="#333">serde 序列化统一文档数据模型（config + endpoints）</text>
  <text x="500" y="300" font-size="13" fill="#333">字段对齐 PHP 语义：title/desc/url/method/params/querys/returned</text>
  <text x="500" y="320" font-size="13" fill="#333">UI 展示与导出功能共用同一数据源</text>

  <!-- 卡片 5 -->
  <rect x="40" y="370" width="420" height="130" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="300" y="360" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="375" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">规划中</text>
  <text x="60" y="406" font-size="17" font-weight="bold" fill="#566573">在线调试 + Mock</text>
  <text x="60" y="430" font-size="13" fill="#333">浏览器 CORS 直连目标接口调试，无需服务端代理</text>
  <text x="60" y="450" font-size="13" fill="#333">Mock 规则（@integer(1,100) 等）映射 fake crate 生成数据</text>
  <text x="60" y="470" font-size="13" fill="#333">多应用 / 多版本 / 访问密码</text>

  <!-- 卡片 6 -->
  <rect x="480" y="370" width="420" height="130" rx="10" fill="#fdfefe" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="740" y="360" width="150" height="24" rx="12" fill="#95a5a6"/>
  <text x="815" y="376" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">规划中</text>
  <text x="500" y="406" font-size="17" font-weight="bold" fill="#566573">多框架适配 + 导出</text>
  <text x="500" y="430" font-size="13" fill="#333">apidoc-axum / apidoc-actix 薄适配器，核心零改动</text>
  <text x="500" y="450" font-size="13" fill="#333">导出 Markdown / TypeScript / Swagger(OpenAPI3)</text>
  <text x="500" y="470" font-size="13" fill="#333">文档缓存 / 调试事件（v2：代码生成器、分享链接）</text>

  <text x="470" y="530" text-anchor="middle" font-size="13" fill="#888">watermark: https://erik.xyz</text>
</svg>
