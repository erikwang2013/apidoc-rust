[workspace]
resolver = "2"
members = ["crates/apidoc", "crates/apidoc-macros", "crates/apidoc-test-fixtures"]

[workspace.package]
version = "2.0.0"
edition = "2021"
# 实际门槛：宏用 Option::is_none_or（1.82 稳定）；不声明的话更旧的工具链
# 只会从宏展开里报一堆 E0658，看不出是版本问题。
rust-version = "1.82"
license = "MIT"
description = "Rust annotation-driven API documentation framework: compile-time doc collection, web UI, export & mock"
repository = "https://github.com/erikwang2013/apidoc-rust"
